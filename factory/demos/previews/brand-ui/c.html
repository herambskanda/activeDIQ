  --diq-warn:#F5BB4E; --diq-warn-bg:#3A2A09;
  --diq-crit:#FF8077; --diq-crit-bg:#431712;
  --diq-muted:#9DABB7; --diq-muted-bg:#1F2A34;
  --diq-radius-1:2px; --diq-radius-2:4px; --diq-radius-3:6px;
  --diq-shadow-1:none; --diq-shadow-2:0 0 0 1px #26313B;
  --diq-row:28px; --diq-row-alt:36px; --diq-control:28px;
  --diq-text-table:13px; --diq-text-ui:13px; --diq-text-body:14px; --diq-text-title:20px; --diq-text-cap:12px;
  --diq-nav-w:56px; --diq-sheet-w:480px;
  --diq-dur:100ms;
}

/* Shared structure for the three previews. Colour, type, radius, density come only from tokens-<x>.css (--diq-*). */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--diq-bg);color:var(--diq-text);font:400 var(--diq-text-ui)/1.45 var(--diq-font-sans);-webkit-font-smoothing:antialiased;--pv:36px;overflow:hidden}
h1,h2,h3,p,ul,ol,dl,dd{margin:0;padding:0}
ul,ol{list-style:none}
a{color:var(--diq-signal-text)}
.mono{font-family:var(--diq-font-mono);font-variant-numeric:tabular-nums;font-size:.92em}
.dim{color:var(--diq-text-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sp{flex:1}
:focus-visible{outline:2px solid var(--diq-focus);outline-offset:2px}
.ic{flex:none;width:16px;height:16px}
kbd{font:500 11px/1 var(--diq-font-mono);padding:2px 4px;border:1px solid var(--diq-line-strong);border-radius:var(--diq-radius-1);color:var(--diq-text-2);background:transparent}
.primary kbd{color:inherit;border-color:currentColor;opacity:.85}
.app{height:calc(100vh - var(--pv));overflow:hidden}
.col{min-width:0;display:flex;flex-direction:column;min-height:0}
.main{overflow:auto;min-height:0;min-width:0;scroll-padding-top:56px}
button{font:inherit;color:inherit}
.btn{height:var(--diq-control);padding:0 12px;border:1px solid var(--diq-line-strong);background:var(--diq-surface);color:var(--diq-text);border-radius:var(--diq-radius-2);font-weight:500;font-size:var(--diq-text-ui);display:inline-flex;align-items:center;gap:8px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background var(--diq-dur),border-color var(--diq-dur)}
.btn:hover{background:var(--diq-surface-2)}
.btn.primary{background:var(--diq-signal);border-color:var(--diq-signal);color:var(--diq-signal-ink)}
.btn.primary:hover{background:var(--diq-signal-hover);border-color:var(--diq-signal-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--diq-surface-2)}
.btn.icon{width:var(--diq-control);padding:0;justify-content:center}
.btn[disabled]{opacity:1;color:var(--diq-text-3);border-color:var(--diq-line);background:var(--diq-surface-2);cursor:not-allowed}
.btn.primary[disabled]{background:var(--diq-surface-2);color:var(--diq-text-3);border-color:var(--diq-line)}
.link{background:none;border:0;padding:0;color:var(--diq-signal-text);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font:inherit}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px 0 6px;border-radius:var(--diq-radius-1);font-size:var(--diq-text-cap);font-weight:500;white-space:nowrap;margin-right:4px;vertical-align:middle}
.chip .ic{width:12px;height:12px}
.chip-ok{background:var(--diq-ok-bg);color:var(--diq-ok)}.chip-warn{background:var(--diq-warn-bg);color:var(--diq-warn)}.chip-crit{background:var(--diq-crit-bg);color:var(--diq-crit)}.chip-muted{background:var(--diq-muted-bg);color:var(--diq-muted)}
.chip-t0{border:1px solid var(--diq-text);color:var(--diq-text);font-weight:600;letter-spacing:.02em}
.fld{display:flex;align-items:center;gap:8px;height:var(--diq-control);padding:0 8px;border:1px solid var(--diq-line-strong);background:var(--diq-surface);border-radius:var(--diq-radius-2);color:var(--diq-text-2)}
.fld.grow{flex:1;min-width:0}
.fld input{flex:1;min-width:0;border:0;background:transparent;color:var(--diq-text);font:inherit;outline:0}
.fld:focus-within{outline:2px solid var(--diq-focus);outline-offset:1px}
.fld input::placeholder{color:var(--diq-text-3);opacity:1}
.fld2{display:flex;flex-direction:column;gap:4px;margin-top:12px;font-weight:500}
.fld2 input{height:var(--diq-control);padding:0 8px;border:1px solid var(--diq-line-strong);background:var(--diq-surface);color:var(--diq-text);border-radius:var(--diq-radius-2);font-size:var(--diq-text-ui);width:100%}
.fld2 input[disabled]{background:var(--diq-surface-2);color:var(--diq-text-3)}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px}
.chk input,.tbl input[type=checkbox]{width:16px;height:16px;accent-color:var(--diq-signal);margin:0}
/* top bar pieces */
.search{display:flex;align-items:center;gap:8px;height:var(--diq-control);min-width:0;flex:1;max-width:520px;padding:0 8px;border:1px solid var(--diq-line-strong);background:var(--diq-surface);color:var(--diq-text-2);border-radius:var(--diq-radius-2);cursor:text;text-align:left;font-size:var(--diq-text-ui)}
.search-t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--diq-text-3)}
.scope{display:inline-flex;align-items:center;gap:4px;font-size:var(--diq-text-cap);color:var(--diq-text-2);border:1px solid var(--diq-line-strong);padding:2px 8px;border-radius:var(--diq-radius-1);white-space:nowrap}
.tb-r{display:flex;align-items:center;gap:4px;margin-left:auto}
.tb-btn{height:var(--diq-control);display:inline-flex;align-items:center;gap:4px;padding:0 8px;border:0;background:transparent;border-radius:var(--diq-radius-2);cursor:pointer;color:var(--diq-text-2);font-size:var(--diq-text-cap);white-space:nowrap}
.tb-btn:hover{background:var(--diq-surface-2)}.tb-btn.icon{width:var(--diq-control);padding:0;justify-content:center;font-weight:600;font-size:var(--diq-text-ui)}
.avatar{width:var(--diq-control);height:var(--diq-control);border-radius:50%;border:1px solid var(--diq-line-strong);background:var(--diq-surface-2);color:var(--diq-text);font-size:11px;font-weight:600;cursor:pointer}
.nav-n{background:var(--diq-signal);color:var(--diq-signal-ink);font:600 11px/16px var(--diq-font-mono);min-width:16px;text-align:center;border-radius:8px;padding:0 4px;margin-left:auto}
/* page */
.main>*{max-width:1560px;flex:none}
.topbar{flex:none}
.c-chk input{display:block}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.page-a{display:flex;gap:8px}
h1{font-size:var(--diq-text-title);line-height:1.2;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--diq-text-2);margin-top:4px}
.pv-tag{font:500 11px/1 var(--diq-font-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--diq-text-2);border:1px dashed var(--diq-line-strong);padding:2px 6px;border-radius:var(--diq-radius-1)}
.views{display:flex;gap:0;overflow-x:auto}
.vt,.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--diq-text-2);cursor:pointer;height:36px;padding:0 12px;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.vt:hover,.tab:hover{color:var(--diq-text)}
.vt.on,.tab.on{color:var(--diq-text);border-bottom-color:var(--diq-signal)}
.vt-c{color:var(--diq-text-3);font-weight:400}
.toolbar{display:flex;gap:8px;align-items:center}
.bulk{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--diq-signal-soft);border:1px solid var(--diq-signal);border-radius:var(--diq-radius-2);z-index:5}
.bulk-n{margin-right:8px}
.selbanner{padding:8px 12px;background:var(--diq-surface-2);border:1px solid var(--diq-line);border-radius:var(--diq-radius-2);color:var(--diq-text)}
.tablewrap{background:var(--diq-surface);border:1px solid var(--diq-line);border-radius:var(--diq-radius-2)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:var(--diq-text-table)}
.tbl th{position:sticky;top:0;z-index:2;background:var(--diq-surface-2);text-align:left;font-weight:600;color:var(--diq-text-2);font-size:var(--diq-text-cap);height:32px;padding:0 12px;border-bottom:1px solid var(--diq-line-strong);white-space:nowrap}
.th-b{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:4px;align-items:center;height:100%}
.sort{font-size:9px}
.tbl td{height:var(--diq-row);padding:0 12px;border-bottom:1px solid var(--diq-line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl.alt td{height:var(--diq-row-alt)}
.tbl tr:hover td{background:var(--diq-surface-2)}
.tbl tr.sel td{background:var(--diq-signal-soft)}
.tbl tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--diq-signal)}
.c-chk{width:40px;padding-right:0!important}.c-name{width:25%}.c-sam{width:15%}.c-upn{width:22%}.c-ou{width:15%}.c-last{width:112px}.c-status{width:264px}
.rowlink{color:var(--diq-text);font-weight:500;text-decoration:none}
.rowlink:hover{color:var(--diq-signal-text);text-decoration:underline}
.empty-b{padding:48px 16px;text-align:center;display:grid;gap:8px;justify-items:center}
.empty-t{font-weight:600;font-size:var(--diq-text-body)}
tr.empty td,tr.empty:hover td{height:auto;background:var(--diq-surface);white-space:normal}
.pager{display:flex;align-items:center;gap:16px;color:var(--diq-text-2);font-size:var(--diq-text-cap)}
/* object page */
.crumb{display:flex;gap:8px;align-items:center;color:var(--diq-text-3);font-size:var(--diq-text-cap)}
.crumb a{color:var(--diq-text-2)}
.objh{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}
.objh-main{display:flex;gap:16px;min-width:0;align-items:center}
.avatar-l{flex:none;width:48px;height:48px;border-radius:var(--diq-radius-2);background:var(--diq-surface-2);border:1px solid var(--diq-line-strong);display:grid;place-items:center;font-weight:600;font-size:16px;color:var(--diq-text)}
.objh-t{min-width:0}
.objh-t h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.objh-id{display:flex;gap:16px;flex-wrap:wrap;color:var(--diq-text-2);margin:4px 0 8px}
.objh-a{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.t0note{display:flex;gap:8px;align-items:center;max-width:320px;font-size:var(--diq-text-cap);color:var(--diq-text)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border:1px solid var(--diq-line-strong);border-left:4px solid var(--diq-warn);background:var(--diq-warn-bg);color:var(--diq-text);border-radius:var(--diq-radius-2)}
.banner.warn .ic{color:var(--diq-warn)}.banner.ok{background:var(--diq-ok-bg);border-left-color:var(--diq-ok)}.banner.ok .ic{color:var(--diq-ok)}
.banner .link{margin-left:8px}
.tabs{display:flex;border-bottom:1px solid var(--diq-line)}
.panel{background:var(--diq-surface);border:1px solid var(--diq-line);border-radius:var(--diq-radius-2);padding:16px}
.panel h2{font-size:var(--diq-text-ui);font-weight:600;margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--diq-text-2);font-size:var(--diq-text-cap)}
.kv-r{display:grid;grid-template-columns:168px 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--diq-line);align-items:baseline}
.kv-r:first-child{border-top:0}
.kv dt{color:var(--diq-text-2)}.kv-s{display:block;color:var(--diq-text-3);font-size:11px}
.kv dd{min-width:0;overflow-wrap:anywhere}
.wrapany{word-break:break-all}
.copy{margin-left:8px;border:0;background:none;color:var(--diq-text-2);cursor:pointer;padding:2px;border-radius:var(--diq-radius-1);vertical-align:middle}
.copy:hover{color:var(--diq-signal-text)}
.more{margin-top:8px}.more summary{cursor:pointer;color:var(--diq-text-2);padding:4px 0}
.tl li{display:grid;grid-template-columns:132px 76px 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--diq-line);align-items:baseline}
.tl li:first-child{border-top:0}
.tl-s{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--diq-text-2)}
.tl-t{color:var(--diq-text-2)}
.mini{width:100%;border-collapse:collapse}.mini th{text-align:left;color:var(--diq-text-2);font-size:var(--diq-text-cap);padding:8px 0;border-bottom:1px solid var(--diq-line-strong)}.mini td{padding:8px 0;border-bottom:1px solid var(--diq-line)}
/* sheet */
.sheet{display:flex;flex-direction:column;background:var(--diq-surface);color:var(--diq-text);z-index:20;min-height:0}
.sheet[hidden]{display:none}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:16px 20px;border-bottom:1px solid var(--diq-line)}
.sh-h h2{font-size:var(--diq-text-body);font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.sh-b{flex:1;overflow:auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:16px}
.sh-s h3,.impact h3{font-size:var(--diq-text-cap);font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--diq-text-2);margin-bottom:8px}
.sh-s p{margin-top:8px}
.sh-f{display:flex;gap:8px;align-items:center;padding:12px 20px;border-top:1px solid var(--diq-line-strong);background:var(--diq-surface)}
.why{flex:1;color:var(--diq-text-2);font-size:var(--diq-text-cap)}
.pwbox{display:flex;gap:4px}.pwbox input{flex:1;min-width:0;height:var(--diq-control);padding:0 8px;border:1px solid var(--diq-line-strong);background:var(--diq-surface-2);color:var(--diq-text);border-radius:var(--diq-radius-2);font-size:var(--diq-text-ui)}
.ok-t{display:flex;align-items:center;gap:8px;color:var(--diq-ok);font-weight:500}
.impact{border:1px solid var(--diq-line-strong);border-radius:var(--diq-radius-2);padding:12px 16px;background:var(--diq-surface)}
.imp li{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:8px 0 8px 12px;border-top:1px solid var(--diq-line);border-left:3px solid var(--diq-line-strong);margin-top:-1px}
.imp li:first-child{border-top:0}
.imp-change{border-left-color:var(--diq-signal)!important}.imp-skip{border-left-color:var(--diq-warn)!important}
.imp-k{font:600 11px/1.6 var(--diq-font-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--diq-text-2)}

/* toasts + preview strip */
.toasts{position:fixed;right:16px;bottom:calc(var(--pv) + 12px);display:grid;gap:8px;z-index:50;max-width:480px}
.toast{display:flex;gap:16px;align-items:center;padding:12px 16px;background:var(--diq-text);color:var(--diq-bg);border-radius:var(--diq-radius-2);box-shadow:var(--diq-shadow-2)}
.toast .link{color:inherit;font-weight:600}.toast-x{background:none;border:0;color:inherit;cursor:pointer;padding:2px;margin-left:auto}
.toast .mono{color:inherit}
.pv{position:fixed;left:0;right:0;bottom:0;height:var(--pv);z-index:60;display:flex;gap:12px;align-items:center;padding:0 12px;background:var(--diq-surface-2);border-top:1px dashed var(--diq-line-strong);overflow-x:auto;white-space:nowrap;font-family:var(--diq-font-mono)}
.pv-st{display:flex;gap:4px}
.pv-st a{font-size:11px;color:var(--diq-text);padding:4px 8px;border-radius:var(--diq-radius-1);text-decoration:none;border:1px solid var(--diq-line-strong);background:var(--diq-surface)}
.pv-st a:hover{background:var(--diq-signal-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Direction C "Night Shift": dark-first, 56 px icon rail with flyouts, 28 px rows, docked side panel, mono-forward. */
.app{display:grid;grid-template-columns:var(--diq-nav-w) minmax(0,1fr) auto}
.rail{position:relative;z-index:30;background:var(--diq-surface);border-right:1px solid var(--diq-line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px}

.rail-g{position:relative}
.rail-i{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:var(--diq-radius-2);color:var(--diq-text-2)}
.rail-i .ic{width:20px;height:20px}
.rail-g:hover .rail-i,.rail-g:focus-within .rail-i{background:var(--diq-surface-2);color:var(--diq-text)}

.fly{display:none;position:absolute;left:100%;top:-4px;margin-left:8px;width:224px;padding:8px;background:var(--diq-surface-2);border:1px solid var(--diq-line-strong);border-radius:var(--diq-radius-3);z-index:40}
.rail-g::after{content:'';position:absolute;left:100%;top:0;width:8px;height:100%}

.fly-t{font:500 11px/1 var(--diq-font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--diq-text-2);padding:8px}
.fly-h{font:500 11px/1 var(--diq-font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--diq-text-3);padding:12px 8px 4px;border-top:1px solid var(--diq-line);margin-top:8px}
.fly-k,.nav-p{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:var(--diq-radius-1);color:var(--diq-text);text-decoration:none}
.fly-k:hover,.nav-p:hover{background:var(--diq-surface)}
.fly-k.on{color:var(--diq-signal-text);font-weight:600}
.fly-m{display:block;padding:4px 8px 8px;color:var(--diq-text-2);font-size:var(--diq-text-cap)}
.nav-p .ic{display:none}.nav-c{margin-left:auto;color:var(--diq-text-2);font-size:11px}
.topbar{display:flex;align-items:center;gap:16px;height:44px;padding:0 16px;background:var(--diq-surface);border-bottom:1px solid var(--diq-line)}
.topbar .search{background:var(--diq-bg);border-color:var(--diq-line-strong);max-width:640px;font-family:var(--diq-font-mono);font-size:12px}
.topbar .search .search-t{color:var(--diq-text-2)}
.topbar .scope{margin-left:auto}.topbar .tb-r{margin-left:0}
.main{padding:16px 20px 24px;display:flex;flex-direction:column;gap:8px}
h1{font-size:20px;display:flex;align-items:center;gap:8px}
/* signature motif: the caret — a block cursor after page titles and on the active row */
h1::after{content:'';width:.5em;height:.95em;background:var(--diq-signal);display:inline-block;animation:caret 1.1s steps(1) infinite;margin-left:2px}
@keyframes caret{50%{opacity:0}}
.page-h{align-items:center}
.views{border-bottom:1px solid var(--diq-line)}
.vt,.tab{height:32px;padding:0 10px;font-size:13px}
.vt-c{font-size:11px}
.btn{height:28px;padding:0 10px;font-size:12px;border-color:var(--diq-line-strong)}
.fld{height:28px}
.tablewrap{border-radius:var(--diq-radius-2);border-color:var(--diq-line)}
.tbl{font-size:13px}
.tbl th{height:28px;font-family:var(--diq-font-mono);font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-size:11px;padding:0 10px}
.tbl td{padding:0 10px;border-bottom-color:var(--diq-line)}
.c-name{width:30%}.c-status{width:260px}
body.sheet-open .c-upn{display:none}
.c-name .rowlink{font-weight:500}
.tbl tr.sel td{background:var(--diq-signal-soft)}
.chip{height:18px;font-size:11px;padding:0 6px 0 4px;font-family:var(--diq-font-mono);font-weight:500}.chip .ic{width:11px;height:11px}

const PASSPHRASE = 'copper-lantern-wobble-7-stream';

}

  <details class="more"><summary>The ${num(Math.min(change.length, 5))} first of ${num(change.length)} accounts</summary><ul class="names">${names(change, 5)}</ul></details></section>

  <footer class="sh-f"><span class="why">${change.length === 0 ? 'Nothing to disable in this selection.' : typedOk ? 'Ready.' : `Type “${need}” to continue.`}</span><button class="btn ghost" type="button" data-act="close">Cancel <kbd>Esc</kbd></button><button class="btn primary danger" type="button" id="confirm" data-act="confirm-disable" ${typedOk && change.length ? '' : 'aria-disabled="true" disabled'}>Disable ${num(change.length)} ${change.length === 1 ? 'user' : 'users'}</button></footer>`;
}
function sheetQuick() {
  const u = BY_SAM.get(S.sam); return `${head(esc(u.name), `<span class="mono">${esc(u.sam)}</span>`)}<div class="sh-b"><div class="objh-ch">${chips(u)}</div>${u.locked ? `<div class="banner warn" role="status">${I('lock')}<div><b>Locked out since ${fmtTime(u.lockedAt)} UTC</b> · ${u.lockouts}× today</div></div>` : ''}${kv([['UPN', `<span class="mono">${esc(u.upn)}</span>`], ['Title', esc(u.title)], ['Location', esc(u.ou.slice().reverse().join(' / '))], ['Last logon', u.lastLogon ? `<span class="mono">${fmtAbs(u.lastLogon)}</span>` : 'Never'], ['Password expires', u.pwdNever ? 'Never' : `<span class="mono">${fmtDate(u.pwdExpires)}</span>`]])}</div><footer class="sh-f"><span class="why"></span>${u.locked && !u.tier0 ? '<button class="btn" type="button" data-act="quick-reset">Reset &amp; unlock <kbd>R</kbd></button>' : ''}<a class="btn primary" href="#/users/${encodeURIComponent(u.sam)}" data-open-page>Open page <kbd>⏎</kbd></a></footer>`;
}
function sheetDone() {
  const sh = S.sheet; const u = BY_SAM.get(S.sam); const m = sh.mode;
  return `${head(m === 'unlock' ? 'Account unlocked' : sh.wasLocked ? 'Password reset and account unlocked' : 'Password reset', `<span class="mono">${esc(u.sam)}</span> · ${esc(u.name)}`)}<div class="sh-b"><div class="banner ok" role="status">${I('check')}<div><b>Done at ${fmtTime(sh.at)} UTC.</b> ${m === 'unlock' ? 'The account is unlocked.' : 'Tell the caller the password; they must change it at next logon.'}</div></div><ul class="imp"><li class="imp-change"><span class="imp-k">Changed</span><span>${m === 'unlock' ? '' : '<b>Password</b> replaced · must change at next logon<br>'}${sh.wasLocked ? '<b>Lockout</b> cleared' : ''}</span></li><li class="imp-note"><span class="imp-k">Recorded</span><span>Dana Whitfield · Help desk tier 1 · ${fmtTime(sh.at)} UTC · caller verified by code. <button type="button" class="link" data-act="view-history">View in History</button></span></li><li class="imp-note"><span class="imp-k">Undo</span><span>Not available: the previous password is not stored.</span></li></ul></div><footer class="sh-f"><span class="why"></span><button class="btn primary" type="button" data-act="close">Close <kbd>Esc</kbd></button></footer>`;
}
function renderSheet() {
  const el = $('#sheet'); const sh = S.sheet; document.body.classList.toggle('sheet-open', !!sh);
  if (!sh) { el.hidden = true; el.innerHTML = ''; return; }
  const html = { reset: () => sheetReset('reset+unlock'), unlock: () => sheetReset('unlock'), disable: sheetDisable, quick: sheetQuick, 'done-reset': sheetDone }[sh.kind]();
  const fresh = el.hidden; el.hidden = false; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'false'); el.setAttribute('aria-labelledby', 'sh-t'); el.innerHTML = html;
  if (fresh || sh.focus) { const t = $('#code:not([disabled])') || $('[data-act=send-code]') || $('#typed') || $('#confirm:not([disabled])') || $('.sh-f .btn.primary') || $('.sh-h button'); if (sh.kind === 'reset' || sh.kind === 'unlock') { ($('[data-act=send-code]') || $('#code') || t)?.focus(); } else t?.focus(); sh.focus = false; }
}

/* ---------- render + events ---------- */
function toast(msg, undo) { const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = `<span>${msg}</span>${undo ? '<button type="button" class="link" data-undo>Undo</button>' : ''}<button type="button" class="toast-x" aria-label="Dismiss">${I('x')}</button>`; $('#toasts').append(t); t.querySelector('.toast-x').onclick = () => t.remove(); if (undo) t.querySelector('[data-undo]').onclick = () => { undo(); t.remove(); }; setTimeout(() => t.remove(), 12000); }
function render(keepScroll) {
  COUNTS = counts(); const main = $('#main'); const y = main.scrollTop; main.innerHTML = S.route === 'user' ? userHTML() : listHTML();
  document.title = S.route === 'user' ? `${BY_SAM.get(S.sam).name} · Users · activeDIQ preview ${DIR.toUpperCase()}` : `Users · activeDIQ preview ${DIR.toUpperCase()}`;
  document.body.dataset.route = S.route; if (keepScroll) main.scrollTop = y; renderSheet(); document.querySelectorAll('.nav-c').forEach((n) => { const v = n.closest('[data-view]')?.dataset.view; if (v) n.textContent = num(COUNTS[v]); }); document.querySelectorAll('.sb-p .nav-c').forEach((n) => { const v = n.closest('[data-view]')?.dataset.view; if (v) n.textContent = num(COUNTS[v]); }); writeHash(); updateStates();
}
function closeSheet() { const had = S.sheet; S.sheet = null; renderSheet(); if (had && S.lastFocus && document.contains(S.lastFocus)) S.lastFocus.focus(); }
function openSheet(sh, from) { S.lastFocus = from || document.activeElement; S.sheet = { ...sh, focus: true }; S.step = sh.kind === 'reset' || sh.kind === 'unlock' ? { sent: false, code: '', show: false } : { typed: '' }; renderSheet(); }
function doReset(mode) {
  const u = BY_SAM.get(S.sam); const wasLocked = u.locked && !(S.step.unlock === false); applyReset(u, mode, wasLocked);
  S.sheet = { kind: 'done-reset', mode, at: NOW + 60000, wasLocked }; render(true);
  $('#sheet .sh-f .btn')?.focus();
}
function applyReset(u, mode, wasLocked) {
  if (wasLocked) u.locked = false; if (mode !== 'unlock') { u.pwdSet = NOW + 60000; u.pwdExpires = u.pwdNever ? null : u.pwdSet + 90 * DAY; }
  const ev = extraHistory.get(u.sam) || []; const via = 'Dana Whitfield · Help desk tier 1 · caller verified by code';
  if (mode !== 'unlock') ev.push({ ts: NOW + 60000, stream: 'activeDIQ', what: 'Password reset · must change at next logon', who: via }); if (wasLocked) ev.push({ ts: NOW + 60000, stream: 'activeDIQ', what: 'Account unlocked', who: via });
  extraHistory.set(u.sam, ev);
}
function doDisable() {
  const { change, t0, already } = bulkTargets(); const prev = change.map((u) => u.sam); const n = change.length;
  change.forEach((u) => { u.disabled = true; const e = extraHistory.get(u.sam) || []; e.push({ ts: NOW + 60000, stream: 'activeDIQ', what: 'Account disabled · bulk action', who: 'Dana Whitfield · Help desk tier 1' }); extraHistory.set(u.sam, e); });
  S.sel = new Set(); S.allMatching = false; S.sheet = null; render(true);
  toast(`<b>Disabled ${num(n)} ${n === 1 ? 'user' : 'users'}.</b> ${t0.length ? `${t0.length} Tier 0 skipped. ` : ''}${already.length ? `${already.length} were already disabled.` : ''}`, () => { prev.forEach((s) => { BY_SAM.get(s).disabled = false; const e = extraHistory.get(s); e.push({ ts: NOW + 120000, stream: 'activeDIQ', what: 'Account re-enabled · undo of bulk disable', who: 'Dana Whitfield · Help desk tier 1' }); }); render(true); toast(`Re-enabled ${num(prev.length)} users.`); });
}
function go(h) { location.hash = h; }
document.addEventListener('click', (e) => {
  const t = e.target.closest('a, button, th, tr[data-sam]'); if (!t) return;
  if (t.dataset.stub !== undefined) { e.preventDefault(); toast(`<b>${esc(t.dataset.stub)}</b> is outside this preview (it covers Directory › Users and one user).`); return; }
  if (t.matches('.rowlink')) { e.preventDefault(); const sam = t.closest('tr').dataset.sam; if (e.ctrlKey || e.metaKey || e.detail === 0) { S.route = 'user'; S.sam = sam; S.tab = 'overview'; S.sheet = null; render(); $('#main').scrollTop = 0; $('#main h1')?.focus?.(); } else { S.sam = sam; openSheet({ kind: 'quick' }, t); } return; }
  if (t.matches('[data-open-page]')) { e.preventDefault(); S.route = 'user'; S.sheet = null; S.tab = 'overview'; render(); return; }
  if (t.matches('[data-act=back]')) { e.preventDefault(); S.route = 'list'; S.sheet = null; render(); return; }
  if (t.dataset.view !== undefined && (t.matches('.vt') || t.matches('[data-view]'))) { e.preventDefault(); S.route = 'list'; S.view = t.dataset.view; S.page = 0; S.sel = new Set(); S.allMatching = false; S.sheet = null; render(); return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; S.sheet = null; render(true); return; }
  if (t.dataset.sort) { const k = t.dataset.sort; S.sort = { key: k, dir: S.sort.key === k && S.sort.dir === 'asc' ? 'desc' : 'asc' }; S.page = 0; render(true); return; }
  if (t.matches('[data-palette]')) { $('#search').blur(); toast('Search and the command palette are specified in the IA (§5). This preview filters the table below with “Filter users”.'); return; }
  if (t.dataset.copy) { navigator.clipboard?.writeText(t.dataset.copy).catch(() => {}); toast(`Copied <span class="mono">${esc(t.dataset.copy.slice(0, 48))}${t.dataset.copy.length > 48 ? '…' : ''}</span>`); return; }
  const a = t.dataset.act; if (!a) return;
  const act = {
    'select-all': () => { S.allMatching = true; render(true); }, clear: () => { S.sel = new Set(); S.allMatching = false; render(true); },
    'bulk-disable': () => openSheet({ kind: 'disable' }, t), 'bulk-export': () => { const rows = query(); const sel = S.allMatching ? rows : rows.filter((u) => S.sel.has(u.sam)); if (sel.length > 10000) return toast('Export of ' + num(sel.length) + ' rows runs as a job and lands in Audit › Jobs.'); const csv = ['sAMAccountName,displayName,userPrincipalName,distinguishedName', ...sel.map((u) => [u.sam, u.name, u.upn, u.dn].map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(','))].join('\r\n'); try { const a2 = document.createElement('a'); a2.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a2.download = 'users-preview.csv'; a2.click(); } catch (_) {} toast(`Exported ${num(sel.length)} rows (preview data).`); },
    density: () => { S.compact = !S.compact; render(true); }, 'reset-filters': () => { S.q = ''; S.view = 'all'; render(); }, prev: () => { S.page--; render(true); }, next: () => { S.page++; render(true); },
    'open-reset': () => openSheet({ kind: 'reset' }, t), 'open-unlock': () => openSheet({ kind: 'unlock' }, t), 'quick-reset': () => { S.route = 'user'; render(); openSheet({ kind: 'reset' }, $('[data-act=open-reset]')); },
    close: closeSheet, 'send-code': () => { S.step.sent = true; renderSheet(); $('#code').focus(); }, 'pw-show': () => { S.step.show = !S.step.show; renderSheet(); $('[data-act=pw-show]').focus(); }, 'pw-copy': () => toast('Password copied. It is not stored or logged (preview).'), 'pw-regen': () => toast('Another passphrase generated (preview shows one fixed sample).'),
    'confirm-reset': () => { if (!t.disabled) doReset(S.sheet.kind === 'unlock' ? 'unlock' : 'reset+unlock'); }, 'confirm-disable': () => { if (!t.disabled) doDisable(); }, 'view-history': () => { S.tab = 'history'; closeSheet(); render(true); },
  }[a]; if (act) { e.preventDefault(); act(); }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'filter') { S.q = t.value; S.page = 0; S.sel = new Set(); S.allMatching = false; const pos = t.selectionStart; render(true); const f = $('#filter'); f.focus(); f.setSelectionRange(pos, pos); }
  else if (t.id === 'chkall') { const rows = query().slice(S.page * PAGE, S.page * PAGE + PAGE); if (t.checked) rows.forEach((u) => S.sel.add(u.sam)); else { S.sel = new Set(); S.allMatching = false; } render(true); $('#chkall').focus(); }
  else if (t.closest('td.c-chk')) { const sam = t.closest('tr').dataset.sam; t.checked ? S.sel.add(sam) : S.sel.delete(sam); S.allMatching = false; render(true); document.querySelector(`tr[data-sam="${CSS.escape(sam)}"] input`)?.focus(); }
  else if (t.id === 'code') { S.step.code = t.value.replace(/\D/g, ''); t.value = S.step.code; const ok = /^\d{6}$/.test(S.step.code); const b = $('#confirm'); b.disabled = !ok; ok ? b.removeAttribute('aria-disabled') : b.setAttribute('aria-disabled', 'true'); $('#why').textContent = ok ? 'Caller verified. Ready.' : 'Enter the 6-digit code to continue.'; }
  else if (t.id === 'unl') { S.step.unlock = t.checked ? undefined : false; const keep = $('.sh-b').scrollTop; renderSheet(); $('#unl').focus(); }
  else if (t.id === 'typed') { S.step.typed = t.value; const pos = t.selectionStart; renderSheet(); const f = $('#typed'); f.focus(); f.setSelectionRange(pos, pos); }
});
document.addEventListener('keydown', (e) => {
  const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && e.target.type !== 'checkbox';
  if (e.key === 'Escape') { if (S.sheet) { e.preventDefault(); closeSheet(); } else if (S.sel.size) { S.sel = new Set(); S.allMatching = false; render(true); } return; }
  if (e.key === 'Enter' && S.sheet && !e.target.closest('button, a') && $('#confirm') && !$('#confirm').disabled) { e.preventDefault(); $('#confirm').click(); return; }
  if (inField) return;
  if (e.key === '/' && !e.metaKey) { e.preventDefault(); ($('#filter') || $('#search')).focus(); return; }
  if (S.route === 'user' && !S.sheet && !BY_SAM.get(S.sam).tier0) { const u = BY_SAM.get(S.sam); if (e.key.toLowerCase() === 'r' && !u.disabled) { e.preventDefault(); openSheet({ kind: 'reset' }, document.activeElement); } if (e.key.toLowerCase() === 'u' && u.locked) { e.preventDefault(); openSheet({ kind: 'unlock' }, document.activeElement); } }
  if (e.target.closest('.tbl tbody') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { const tr = e.target.closest('tr'); const nx = e.key === 'ArrowDown' ? tr.nextElementSibling : tr.previousElementSibling; if (nx) { e.preventDefault(); const sel = e.target.matches('input') ? 'input' : 'a'; nx.querySelector(sel)?.focus(); } }
});
window.addEventListener('hashchange', () => { readHash(); render(); });

/* preview-only state strip (not product chrome) */
function updateStates() { document.querySelectorAll('.pv-st a').forEach((a) => a.removeAttribute('aria-current')); }
function pvBar() {
  const base = location.pathname.split('/').pop();
  const items = [['List', '#/users'], ['Locked view', '#/users?view=locked'], ['Selected', '#/users?sel=few'], ['All 12,431', '#/users?sel=all'], ['Bulk impact', '#/users?sel=all&sheet=disable'], ['Compact', '#/users?compact=1'], ['User', '#/users/praghunathan'], ['Reset: send code', '#/users/praghunathan?sheet=reset'], ['Reset: impact, ready', '#/users/praghunathan?sheet=reset&code=typed'], ['Done', '#/users/praghunathan?sheet=done'], ['Tier 0 user', '#/users/adm_madeyemi'], ['No results', '#/users?q=zzzz'], ['↺ Restart', '#restart']];
  document.body.insertAdjacentHTML('beforeend', `<div class="pv" role="complementary" aria-label="Preview controls"><span class="pv-tag">Preview — sample data</span><nav class="pv-st" aria-label="Preview states">${items.map(([l, h]) => `<a href="${h}" data-pv>${l}</a>`).join('')}</nav></div><div id="toasts" class="toasts" role="status" aria-live="polite"></div>`);
  document.addEventListener('click', (e) => { const a = e.target.closest('a[data-pv]'); if (!a) return; e.preventDefault(); const h = a.getAttribute('href'); if (h === '#restart') { location.hash = '#/users'; location.reload(); return; } if (location.hash === h) { readHash(); render(); } else location.hash = h; });
}
shell(); pvBar(); readHash(); render();
if (S.sheet && ['reset', 'unlock'].includes(S.sheet.kind)) renderSheet();
})();
</script>
