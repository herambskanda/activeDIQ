:root{
  --diq-font-sans:'Source Sans 3',system-ui,'Segoe UI',sans-serif;
  --diq-font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:light;
  /* neutrals — cool harbour grey */
  --diq-bg:#EFF4F6; --diq-surface:#FFFFFF; --diq-surface-2:#E3EBEF;
  --diq-line:#D3DDE3; --diq-line-strong:#72848F;
  --diq-text:#0D1D25; --diq-text-2:#3A4F5A; --diq-text-3:#4E6370;
  /* signal — Harbor Teal */
  --diq-signal:#0A6E7A; --diq-signal-ink:#FFFFFF; --diq-signal-text:#0A6E7A; --diq-signal-soft:#DAF0F2; --diq-signal-hover:#085862;
  --diq-focus:#0A6E7A;
  --diq-ok:#17663A;   --diq-ok-bg:#DFF1E6;
  --diq-warn:#7F4B00; --diq-warn-bg:#FAEBCB;
  --diq-crit:#AE241C; --diq-crit-bg:#FBE3E0;
  --diq-muted:#4B5D68; --diq-muted-bg:#E3EBEF;
  --diq-radius-1:4px; --diq-radius-2:8px; --diq-radius-3:12px;
  --diq-shadow-1:0 1px 2px rgba(13,29,37,.08),0 1px 1px rgba(13,29,37,.04);
  --diq-shadow-2:0 8px 24px rgba(13,29,37,.14),0 2px 6px rgba(13,29,37,.08);
  --diq-row:44px; --diq-row-alt:36px; --diq-control:36px;
  --diq-text-table:14px; --diq-text-ui:14px; --diq-text-body:16px; --diq-text-title:28px; --diq-text-cap:12px;
  --diq-nav-w:0px; --diq-sheet-w:560px;
  --diq-dur:180ms;
}

/* Shared structure for the three previews. Colour, type, radius, density come only from tokens-<x>.css (--diq-*). */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--diq-bg);color:var(--diq-text);font:400 var(--diq-text-ui)/1.45 var(--diq-font-sans);-webkit-font-smoothing:antialiased;--pv:36px;overflow:hidden}
h1,h2,h3,p,ul,ol,dl,dd{margin:0;padding:0}
ul,ol{list-style:none}
a{color:var(--diq-signal-text)}
.mono{font-family:var(--diq-font-mono);font-variant-numeric:tabular-nums;font-size:.92em}
.dim{color:var(--diq-text-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sp{flex:1}
:focus-visible{outline:2px solid var(--diq-focus);outline-offset:2px}
.ic{flex:none;width:16px;height:16px}
kbd{font:500 11px/1 var(--diq-font-mono);padding:2px 4px;border:1px solid var(--diq-line-strong);border-radius:var(--diq-radius-1);color:var(--diq-text-2);background:transparent}
.primary kbd{color:inherit;border-color:currentColor;opacity:.85}
.app{height:calc(100vh - var(--pv));overflow:hidden}
.col{min-width:0;display:flex;flex-direction:column;min-height:0}
.main{overflow:auto;min-height:0;min-width:0;scroll-padding-top:56px}
button{font:inherit;color:inherit}
.btn{height:var(--diq-control);padding:0 12px;border:1px solid var(--diq-line-strong);background:var(--diq-surface);color:var(--diq-text);border-radius:var(--diq-radius-2);font-weight:500;font-size:var(--diq-text-ui);display:inline-flex;align-items:center;gap:8px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background var(--diq-dur),border-color var(--diq-dur)}
.btn:hover{background:var(--diq-surface-2)}
.btn.primary{background:var(--diq-signal);border-color:var(--diq-signal);color:var(--diq-signal-ink)}
.btn.primary:hover{background:var(--diq-signal-hover);border-color:var(--diq-signal-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--diq-surface-2)}
.btn.icon{width:var(--diq-control);padding:0;justify-content:center}
.btn[disabled]{opacity:1;color:var(--diq-text-3);border-color:var(--diq-line);background:var(--diq-surface-2);cursor:not-allowed}
.btn.primary[disabled]{background:var(--diq-surface-2);color:var(--diq-text-3);border-color:var(--diq-line)}
.link{background:none;border:0;padding:0;color:var(--diq-signal-text);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font:inherit}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px 0 6px;border-radius:var(--diq-radius-1);font-size:var(--diq-text-cap);font-weight:500;white-space:nowrap;margin-right:4px;vertical-align:middle}
.chip .ic{width:12px;height:12px}
.chip-ok{background:var(--diq-ok-bg);color:var(--diq-ok)}.chip-warn{background:var(--diq-warn-bg);color:var(--diq-warn)}.chip-crit{background:var(--diq-crit-bg);color:var(--diq-crit)}.chip-muted{background:var(--diq-muted-bg);color:var(--diq-muted)}
.chip-t0{border:1px solid var(--diq-text);color:var(--diq-text);font-weight:600;letter-spacing:.02em}
.fld{display:flex;align-items:center;gap:8px;height:var(--diq-control);padding:0 8px;border:1px solid var(--diq-line-strong);background:var(--diq-surface);border-radius:var(--diq-radius-2);color:var(--diq-text-2)}
.fld.grow{flex:1;min-width:0}
.fld input{flex:1;min-width:0;border:0;background:transparent;color:var(--diq-text);font:inherit;outline:0}
.fld:focus-within{outline:2px solid var(--diq-focus);outline-offset:1px}
.fld input::placeholder{color:var(--diq-text-3);opacity:1}
.fld2{display:flex;flex-direction:column;gap:4px;margin-top:12px;font-weight:500}
.fld2 input{height:var(--diq-control);padding:0 8px;border:1px solid var(--diq-line-strong);background:var(--diq-surface);color:var(--diq-text);border-radius:var(--diq-radius-2);font-size:var(--diq-text-ui);width:100%}
.fld2 input[disabled]{background:var(--diq-surface-2);color:var(--diq-text-3)}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px}
.chk input,.tbl input[type=checkbox]{width:16px;height:16px;accent-color:var(--diq-signal);margin:0}
/* top bar pieces */
.search{display:flex;align-items:center;gap:8px;height:var(--diq-control);min-width:0;flex:1;max-width:520px;padding:0 8px;border:1px solid var(--diq-line-strong);background:var(--diq-surface);color:var(--diq-text-2);border-radius:var(--diq-radius-2);cursor:text;text-align:left;font-size:var(--diq-text-ui)}
.search-t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--diq-text-3)}
.scope{display:inline-flex;align-items:center;gap:4px;font-size:var(--diq-text-cap);color:var(--diq-text-2);border:1px solid var(--diq-line-strong);padding:2px 8px;border-radius:var(--diq-radius-1);white-space:nowrap}
.tb-r{display:flex;align-items:center;gap:4px;margin-left:auto}
.tb-btn{height:var(--diq-control);display:inline-flex;align-items:center;gap:4px;padding:0 8px;border:0;background:transparent;border-radius:var(--diq-radius-2);cursor:pointer;color:var(--diq-text-2);font-size:var(--diq-text-cap);white-space:nowrap}
.tb-btn:hover{background:var(--diq-surface-2)}.tb-btn.icon{width:var(--diq-control);padding:0;justify-content:center;font-weight:600;font-size:var(--diq-text-ui)}
.avatar{width:var(--diq-control);height:var(--diq-control);border-radius:50%;border:1px solid var(--diq-line-strong);background:var(--diq-surface-2);color:var(--diq-text);font-size:11px;font-weight:600;cursor:pointer}
.nav-n{background:var(--diq-signal);color:var(--diq-signal-ink);font:600 11px/16px var(--diq-font-mono);min-width:16px;text-align:center;border-radius:8px;padding:0 4px;margin-left:auto}
/* page */
.main>*{max-width:1560px;flex:none}
.topbar{flex:none}
.c-chk input{display:block}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.page-a{display:flex;gap:8px}
h1{font-size:var(--diq-text-title);line-height:1.2;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--diq-text-2);margin-top:4px}
.pv-tag{font:500 11px/1 var(--diq-font-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--diq-text-2);border:1px dashed var(--diq-line-strong);padding:2px 6px;border-radius:var(--diq-radius-1)}
.views{display:flex;gap:0;overflow-x:auto}
.vt,.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--diq-text-2);cursor:pointer;height:36px;padding:0 12px;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.vt:hover,.tab:hover{color:var(--diq-text)}
.vt.on,.tab.on{color:var(--diq-text);border-bottom-color:var(--diq-signal)}

    close: closeSheet, 'send-code': () => { S.step.sent = true; renderSheet(); $('#code').focus(); }, 'pw-show': () => { S.step.show = !S.step.show; renderSheet(); $('[data-act=pw-show]').focus(); }, 'pw-copy': () => toast('Password copied. It is not stored or logged (preview).'), 'pw-regen': () => toast('Another passphrase generated (preview shows one fixed sample).'),
    'confirm-reset': () => { if (!t.disabled) doReset(S.sheet.kind === 'unlock' ? 'unlock' : 'reset+unlock'); }, 'confirm-disable': () => { if (!t.disabled) doDisable(); }, 'view-history': () => { S.tab = 'history'; closeSheet(); render(true); },
  }[a]; if (act) { e.preventDefault(); act(); }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'filter') { S.q = t.value; S.page = 0; S.sel = new Set(); S.allMatching = false; const pos = t.selectionStart; render(true); const f = $('#filter'); f.focus(); f.setSelectionRange(pos, pos); }
  else if (t.id === 'chkall') { const rows = query().slice(S.page * PAGE, S.page * PAGE + PAGE); if (t.checked) rows.forEach((u) => S.sel.add(u.sam)); else { S.sel = new Set(); S.allMatching = false; } render(true); $('#chkall').focus(); }
  else if (t.closest('td.c-chk')) { const sam = t.closest('tr').dataset.sam; t.checked ? S.sel.add(sam) : S.sel.delete(sam); S.allMatching = false; render(true); document.querySelector(`tr[data-sam="${CSS.escape(sam)}"] input`)?.focus(); }
  else if (t.id === 'code') { S.step.code = t.value.replace(/\D/g, ''); t.value = S.step.code; const ok = /^\d{6}$/.test(S.step.code); const b = $('#confirm'); b.disabled = !ok; ok ? b.removeAttribute('aria-disabled') : b.setAttribute('aria-disabled', 'true'); $('#why').textContent = ok ? 'Caller verified. Ready.' : 'Enter the 6-digit code to continue.'; }
  else if (t.id === 'unl') { S.step.unlock = t.checked ? undefined : false; const keep = $('.sh-b').scrollTop; renderSheet(); $('#unl').focus(); }
  else if (t.id === 'typed') { S.step.typed = t.value; const pos = t.selectionStart; renderSheet(); const f = $('#typed'); f.focus(); f.setSelectionRange(pos, pos); }
});
document.addEventListener('keydown', (e) => {
  const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && e.target.type !== 'checkbox';
  if (e.key === 'Escape') { if (S.sheet) { e.preventDefault(); closeSheet(); } else if (S.sel.size) { S.sel = new Set(); S.allMatching = false; render(true); } return; }
  if (e.key === 'Enter' && S.sheet && !e.target.closest('button, a') && $('#confirm') && !$('#confirm').disabled) { e.preventDefault(); $('#confirm').click(); return; }
  if (inField) return;
  if (e.key === '/' && !e.metaKey) { e.preventDefault(); ($('#filter') || $('#search')).focus(); return; }
  if (S.route === 'user' && !S.sheet && !BY_SAM.get(S.sam).tier0) { const u = BY_SAM.get(S.sam); if (e.key.toLowerCase() === 'r' && !u.disabled) { e.preventDefault(); openSheet({ kind: 'reset' }, document.activeElement); } if (e.key.toLowerCase() === 'u' && u.locked) { e.preventDefault(); openSheet({ kind: 'unlock' }, document.activeElement); } }
  if (e.target.closest('.tbl tbody') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { const tr = e.target.closest('tr'); const nx = e.key === 'ArrowDown' ? tr.nextElementSibling : tr.previousElementSibling; if (nx) { e.preventDefault(); const sel = e.target.matches('input') ? 'input' : 'a'; nx.querySelector(sel)?.focus(); } }
});
window.addEventListener('hashchange', () => { readHash(); render(); });

/* preview-only state strip (not product chrome) */
function updateStates() { document.querySelectorAll('.pv-st a').forEach((a) => a.removeAttribute('aria-current')); }
function pvBar() {
  const base = location.pathname.split('/').pop();
  const items = [['List', '#/users'], ['Locked view', '#/users?view=locked'], ['Selected', '#/users?sel=few'], ['All 12,431', '#/users?sel=all'], ['Bulk impact', '#/users?sel=all&sheet=disable'], ['Compact', '#/users?compact=1'], ['User', '#/users/praghunathan'], ['Reset: send code', '#/users/praghunathan?sheet=reset'], ['Reset: impact, ready', '#/users/praghunathan?sheet=reset&code=typed'], ['Done', '#/users/praghunathan?sheet=done'], ['Tier 0 user', '#/users/adm_madeyemi'], ['No results', '#/users?q=zzzz'], ['↺ Restart', '#restart']];
  document.body.insertAdjacentHTML('beforeend', `<div class="pv" role="complementary" aria-label="Preview controls"><span class="pv-tag">Preview — sample data</span><nav class="pv-st" aria-label="Preview states">${items.map(([l, h]) => `<a href="${h}" data-pv>${l}</a>`).join('')}</nav></div><div id="toasts" class="toasts" role="status" aria-live="polite"></div>`);
  document.addEventListener('click', (e) => { const a = e.target.closest('a[data-pv]'); if (!a) return; e.preventDefault(); const h = a.getAttribute('href'); if (h === '#restart') { location.hash = '#/users'; location.reload(); return; } if (location.hash === h) { readHash(); render(); } else location.hash = h; });
}
shell(); pvBar(); readHash(); render();
if (S.sheet && ['reset', 'unlock'].includes(S.sheet.kind)) renderSheet();
})();
