<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'sha256-{{.StyleHash}}'; img-src data:">
<meta charset="utf-8">
<title>{{.Title}}</title>
<style>body{font:14px/1.4 system-ui,sans-serif;margin:24px;color:#111;background:#fff}h1{font-size:20px;margin:0 0 12px}dl.about{display:grid;grid-template-columns:max-content 1fr;gap:2px 16px;margin:0 0 16px;font-size:13px}dl.about dt{font-weight:600}dl.about dd{margin:0;overflow-wrap:anywhere}table{border-collapse:collapse;font-size:13px}th,td{border:1px solid #bbb;padding:3px 6px;text-align:left;vertical-align:top;white-space:pre-wrap;overflow-wrap:anywhere}th{background:#eee;position:sticky;top:0}td.n{text-align:right;font-variant-numeric:tabular-nums}td.t{mso-number-format:"\@"}@media print{th{position:static}body{margin:0}}</style>
</head>
<body>
<main>
<h1><bdi>{{.Title}}</bdi></h1>
{{if .About}}<dl class="about">
{{range .About}}<dt><bdi>{{.Label}}</bdi></dt><dd><bdi>{{.Value}}</bdi></dd>
{{end}}</dl>
{{end}}<table>
<thead><tr>{{range .Cols}}<th scope="col"><bdi>{{.}}</bdi></th>{{end}}</tr></thead>
