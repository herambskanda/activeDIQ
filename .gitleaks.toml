# gitleaks configuration (T-0013). Standard: knowledge/development/standards/secret-scanning.md
# Start from the upstream default ruleset (all built-in detectors) and add only what is below.
title = "activeDIQ gitleaks config"

[extend]
useDefault = true

# --- activeDIQ-specific rules -------------------------------------------------------------------
# Lab credentials are generated per run into lab/.lab.env (gitignored); if one is ever pasted into a
# tracked file this rule fires. The pattern matches the variable names lab/bin/lab-env writes.
[[rules]]
id = "activediq-lab-credential"
description = "Lab credential assignment with a literal value (lab credentials are generated per run, never committed)"
regex = '''(?i)\bLAB_[A-Z_]*(?:PASSWORD|SECRET|TOKEN)\s*[=:]\s*['"]?([A-Za-z0-9+/_\-!@#$%^&*]{8,})['"]?'''
keywords = ["lab_"]
[[rules.allowlists]]
description = "Reading the variable from the environment or a generator is not a literal"
regexTarget = "match"
regexes = ['''\$\{?[A-Za-z_]+''', '''\$\(''']

# --- Allowlist ------------------------------------------------------------------------------------
# RULE: allowlist ONLY provably fake values (vendor-published documentation examples) or a single exact
# enum-label line (see T-0450 below, rule + path + literal all required). No bare path
# allowlists: a path exemption would hide a real secret pasted into it. Never allowlist a rule
# globally or a directory of real config. Every entry needs a comment saying why it is fake. Prefer building fake secrets at
# test runtime (tools/secrets/test.sh does) over allowlisting.
[[allowlists]]
description = "Provably-fake values only"
# Values published as documentation examples by their vendors (AKIAIOSFODNN7EXAMPLE etc. are also
# ignored by gitleaks's own aws rule; listed so the intent is explicit).
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
]

# T-0450: the authz.Reason constant ReasonScopeOnly = "tier0_scope_permission_off_scope" (T-0324)
# trips generic-api-key on its high-entropy-looking snake_case string. It is an enum label, not a
# credential. Scoped to ONE rule AND this exact file AND this exact literal (condition = AND), so a
# different value planted in the same file, or this value elsewhere, is still scanned.
[[allowlists]]
description = "rbac ReasonScopeOnly enum label (T-0450)"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^internal/platform/rbac/authorizer\.go$''']
regexTarget = "line"
regexes = ['''ReasonScopeOnly\s+authz\.Reason\s*=\s*"tier0_scope_permission_off_scope"''']

# T-1162: two committed T-0577 QA evidence logs (qa3/qa4 linux test output) contain a slog line
# `... api_token_id="" plan_digest="" tier0_revision=7 ...`. generic-api-key reads the field NAME
# `plan_digest=` as the "secret" (the value is empty and the neighbouring ids are all-zero test UUIDs).
# It is log output, not a credential. Scoped to ONE rule AND these two exact files AND this exact line
# text (condition = AND), so a different value planted in these files, or this line elsewhere, is still scanned.
[[allowlists]]
description = "T-0577 evidence logs: empty plan_digest log field (T-1162)"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^factory/demos/evidence/T-0577/qa[34]-linux-tests-[0-9a-f]+\.txt$''']
regexTarget = "line"
regexes = ['''api_token_id="" plan_digest="" tier0_revision=7 ''']
