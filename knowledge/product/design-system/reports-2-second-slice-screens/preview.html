 * activeDIQ design tokens — the source of truth for the admin console and every product-facing
 * surface (T-0043, direction A "Ledger", D-0012). activeDIQ is a separate brand from skenzeriq (D-0005):
 * nothing here comes from skenzeriq's design system, and the Factory Board keeps its own tokens.
 *
 * Rules (knowledge/product/design-system/brand-guidelines.md):
 *   - Components use `var(--diq-…)` only. A literal colour, font size, spacing or duration is a review blocker.
 *   - Two themes, both WCAG 2.2 AA (web/src/ds/tokens.test.ts checks every pair): light is the base;
 *     dark follows the OS unless <html data-theme="light|dark"> says otherwise.
 *   - One signal colour (cobalt), one job per view. Status colours never appear without a word and a glyph.
 *   - Density: <html data-density="comfortable"> switches the row height from 32 px to 40 px.
 *
 * Fonts: IBM Plex Sans and IBM Plex Mono, SIL OFL 1.1, unmodified Latin and Latin Extended `.woff2`
 * from Fontsource 5.3.0; licence texts and copyright lines are in ./fonts/ (and ship in the installer).
 * Dark-theme values appear twice (data-theme and the OS media query); the test keeps them identical.
 */











:root {
  /* ---- Typography ------------------------------------------------------ */
  --diq-font-sans: "Plex Sans", system-ui, "Segoe UI", sans-serif;
  --diq-font-mono: "Plex Mono", ui-monospace, Consolas, monospace;

  /* Scale: table cells, controls and labels 13; body and form help 14; page title 22; mono eyebrows 11. */

  --diq-text-cap: 12px;
  --diq-text-ui: 13px;
  --diq-text-table: 13px;
  --diq-text-body: 14px;

  --diq-text-title: 22px;

  --diq-weight-semibold: 600;

  --diq-leading-ui: 1.45;
  --diq-leading-body: 1.5;
  --diq-tracking-title: -0.01em;
  --diq-tracking-label: 0.08em;

  /* ---- Space: 4 px grid ------------------------------------------------ */

  --diq-space-2: 8px;
