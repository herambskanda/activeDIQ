# T-0261: signed release publication. On a v* tag: build the CycloneDX SBOM, sign it and the checksum
# list, verify against the committed public key, and publish on the GitHub release. The signing key is
# the repository secret RELEASE_SIGNING_KEY (interim; production custody is T-0140/T-0141). No secret or
# no committed public key means no release: the job fails, it never publishes unsigned. Binary and
# installer artefacts join SHA256SUMS when the packaging tickets produce them.
# Runbook: knowledge/development/runbooks/release-and-security-txt.md
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Judge the built installer (ADR-0006 A1 on the artefact, T-0697)
        # Opens every dist/*.msi with msidump and fails on a LocalSystem or other unpinned service account,
        # a non-restricted SID, privileges beyond the pinned set, or an unreviewed custom action. Prints
        # "inactive" while no MSI is built; the packaging ticket that builds one adds -require here.
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends msitools
          go run ./tools/fitness/builtmsi -glob 'dist/*.msi'
      - name: Build, sign and verify
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          mkdir -p dist
          go run ./tools/release/sbom -version "$TAG" -o "dist/activediq-$TAG.cdx.json"
          (cd dist && sha256sum ./*.json > SHA256SUMS)
          go run ./tools/release/sign sign -sig dist/SHA256SUMS.sig dist/SHA256SUMS
          go run ./tools/release/sign sign -sig "dist/activediq-$TAG.cdx.json.sig" "dist/activediq-$TAG.cdx.json"
          go run ./tools/release/sign verify -pub packaging/release/release-signing.pub -sig dist/SHA256SUMS.sig dist/SHA256SUMS
          go run ./tools/release/sign verify -pub packaging/release/release-signing.pub -sig "dist/activediq-$TAG.cdx.json.sig" "dist/activediq-$TAG.cdx.json"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
