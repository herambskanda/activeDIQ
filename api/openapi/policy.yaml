# The security policy of the contract (ADR-0004 rule 9). Owner: security-architect. Every change
# here is tagged security-sensitive and reviewed against threat model §7.6 (the AN-n allow-list).
#
# Entry shape (checked by fitness-api A13; scalar fields only). Every entry needs `reason` and `ref`
# (an AN-n row or a TM- section). It names its subject by `operation` (an operationId), or `method`
# + `path` for a route (anonymous may use either; nonApiRoutes uses method + path), or `permission`
# (stepUp). Optional: `host`, `gate`; `schema` is required in secretResponses. An entry that names
# something absent from the contract fails; `host` must name a binding in apihost's table
# (internal/platform/apihost/policy.go HostBindings), and an anonymous entry's ref must cite that
# binding's AN row.
#
# Seeded by T-0032 with the non-API routes of ADR-0004 rule 5 (AN-1 to AN-3). T-0034 added the AN-1
# operations getLiveness and getReadiness (TM §7.6 rules 8 and 9). Any other operation, permission
# or schema row would be stale until what it names exists. These rows enter in the change that adds
# what they name. Its owner adds the row, and security-architect reviews it:
#
#   anonymous        AN-4  first-run setup operation                    gate: one-time setup secret
#                    AN-5  end-user TOTP enrolment operations           host: totp-enrolment binding
#                    AN-7  [M4] SSPR operations on the L1 listener      host: sspr binding
#   authenticated    getApiDocument (ADR-0004 rule 5); the caller's own profile, sessions and MFA
#                    factors. Never anything that reads or writes another principal.
#   secretResponses  LAPS reveal and BitLocker reveal (secret.* permissions, DM-33.I2); API-token
#                    creation and connector-enrollment-token creation (shown once, TM §7.5). Class reveal.
#   directory.read   searchDirectoryUsers (T-0668) and searchDirectory (T-1094, a POST read so the text stays out of URLs, ADR-0011 rule 15)
#                    are ordinary permissioned reads: x-permission directory.read, no step-up, no anonymous or authenticated row,
#                    rate class read. No row is stale or missing.
#   reports.*        the 2a report operations (T-0866, modules/reports.yaml) are ordinary permissioned operations: one x-permission each,
#                    no step-up row, no anonymous or authenticated row. reports.run: library, runs, run header, result paging.
#                    reports.export: export, export record, download, delete a file; createReportExport also checks reports.run inside the
#                    operation (modules/reports.md 6.6), one x-permission only. reports.schedule: own schedules (list, get, create,
#                    update, pause, resume, delete, run now). reports.schedule.manage_all: reassignReportSchedule only; it is also checked
#                    inside schedule operations for owner=any, get, and pause of another owner's schedule (spec 8.5: see, pause, reassign).
#                    Update, delete, resume and run now are owner-only; manage_all grants none of them (T-0893 R1, R2):
#                    update, delete and resume answer a non-owner 404, or a manage_all holder 403 not_owner; run now answers any non-owner 404. reports.deliver.external
#                    is bound to NO operation: it guards only the external-recipient case of a schedule write (create, update, resume).
#                    TM 7.4 has no reports row. Step-up is conditional and in-operation (TM-D30, kernel predicate): no stepUp row.
#   stepUp           one row per permission of the TM §7.4 table (TM-D16), named when its operation lands.
#   largeBodies      none planned.

anonymous:
  - method: GET
    path: /healthz
    gate: none
    reason: Liveness for load balancers and orchestrators; status only, no version or configuration detail.
    ref: AN-1
  - method: GET
    path: /readyz
    gate: none
    reason: Readiness for load balancers and orchestrators; status only, no version or configuration detail.
    ref: AN-1
  - operation: getLiveness
    gate: none
    reason: Liveness over the API host for clients that can reach only /api/v1; status only, no version or configuration detail.
    ref: AN-1
  - operation: getReadiness
    gate: none
    reason: Readiness over the API host for clients that can reach only /api/v1; status only, no version or configuration detail.
    ref: AN-1
  - method: GET
    path: /
    gate: none
    reason: The embedded console's index.html and its client-side route fallback; it never answers under /api/ or /auth/ (ADR-0004 rule 5).
    ref: AN-2
  - method: GET
    path: /assets/{path...}
    gate: none
    reason: Static files of the embedded console; no data, no configuration.
    ref: AN-2
  - method: GET
    path: /auth/sso/{idpId}/start
    gate: none; redirects to the configured IdP with state, nonce and PKCE (TM-F-SSO)
    reason: SSO start must be reachable before a session exists.
    ref: AN-3
  - method: GET
    path: /auth/sso/{idpId}/callback
    gate: signed IdP response (OIDC code with state, nonce and PKCE)
    reason: OIDC redirect back from the IdP; yields a session, or a pending sign-in when the IdP is not MFA-asserting (AN-10).
    ref: AN-3
  - method: POST
    path: /auth/sso/{idpId}/callback
    gate: signed IdP response (SAML ACS, signed assertion, pinned algorithm)
    reason: SAML assertion consumer service (HTTP-POST binding); same outcome as the OIDC callback.
    ref: AN-3
  - method: GET
    path: /auth/negotiate
    gate: a Kerberos AP-REQ for the console's HTTP service principal, verified by the acceptor; NTLM is refused, success yields only a pending sign-in (AN-10), never a session
    reason: Integrated Windows sign-in (ADM-143); Kerberos only (TM §7.6 rules 5-7, console-sso.md §9). Off until an administrator enables it (NEG-1).
    ref: AN-9
  - operation: signInBreakGlassPassword
    gate: the local account's password; success yields only a pending sign-in (AN-10), never a session
    reason: Break-glass first factor when SSO is down (ADM-142); one uniform failure shape, throttled and never locked (TM §7.6 rules 1-4).
    ref: AN-8
  - operation: claimFirstRunSetup
    gate: the one-time setup secret (256-bit random, only its hash stored, expires, consumed on first correct use, readable only by the installing administrator)
    reason: First-run setup must be reachable before any account exists (TM-TB16-T7); no default account is ever created.
    ref: AN-4
  - operation: createWebAuthnSignInChallenge
    gate: the pending-sign-in cookie
    reason: Starts the WebAuthn second factor for a pending sign-in from AN-3, AN-8 or AN-9.
    ref: AN-10
  - operation: verifyWebAuthnSignIn
    gate: the pending-sign-in cookie plus the enrolled WebAuthn credential
    reason: The only way a WebAuthn first-factor pending sign-in becomes a session (TM §7.6 rule 1).
    ref: AN-10
  - operation: verifyTotpSignIn
    gate: the pending-sign-in cookie plus the enrolled TOTP factor
    reason: The only way a TOTP pending sign-in becomes a session (TM §7.6 rule 1).
    ref: AN-10
  - operation: completeTakeoverAttestation
    gate: the single-use state issued by the start (random, only its hash stored, ten minutes, consumed on first use) plus PKCE; the tenant is read from the state and used only to look it up
    reason: The browser's return from the Global Administrator's sign-in at the IdP (TM-D17). The console session cookie is SameSite=Strict and is not sent on this cross-site redirect.
    ref: AN-11
authenticated:
  - operation: signOut
    reason: Ends the caller's own session; touches no other principal.
    ref: TM-F-SESSION
  - operation: getCsrfToken
    reason: Gives the caller's own session its CSRF value; touches no other principal.
    ref: TM-F-SESSION
  - operation: reverifyStepUp
    reason: Refreshes the caller's own session MFA time from a TOTP code of the caller's own account; touches no other principal. One refusal shape (403 step-up-refused), class secret per principal, no freshness input.
    ref: TM-D16
nonApiRoutes:
  - method: GET
    path: /healthz
    reason: Health probe for load balancers and orchestrators, not a client API.
    ref: AN-1
  - method: GET
    path: /readyz
    reason: Readiness probe for load balancers and orchestrators, not a client API.
    ref: AN-1
  - method: GET
    path: /
    reason: Console index.html and client-side route fallback (never under /api/ or /auth/).
    ref: AN-2
  - method: GET
    path: /assets/{path...}
    reason: Static files of the embedded console.
    ref: AN-2
  - method: GET
    path: /auth/sso/{idpId}/start
    reason: Browser redirect to the IdP; not JSON.
    ref: AN-3
  - method: GET
    path: /auth/sso/{idpId}/callback
    reason: OIDC redirect from the IdP; not JSON.
    ref: AN-3
  - method: POST
    path: /auth/sso/{idpId}/callback
    reason: SAML ACS form post from the IdP; not JSON.
    ref: AN-3
  - method: GET
    path: /auth/negotiate
    reason: HTTP Negotiate (RFC 4559) is a header exchange, not JSON.
    ref: AN-9
secretResponses: []
stepUp:
  - permission: connections.takeover.attest
    reason: Starting an attestation, and changing how long it stays valid, decide whether hard and soft match blocking count as attested (TM §7.4).
    ref: TM-D17
  - permission: siem.destination.manage
    reason: Creating or changing a SIEM destination can redirect or blind the tenant's audit stream, so it needs a fresh MFA (TM §7.4, AG-8). Reads do not.
    ref: TM-D16
largeBodies: []
