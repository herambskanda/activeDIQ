      in: header
      required: true
      description: The ETag of the object version being changed, as read. A stale value answers precondition-failed; an absent one precondition-required.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    ObjectWriteKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Makes a retry safe. The same key with the same body answers the first answer; the same key with a different body is refused.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9._~-]+$
  schemas:
    ObjectTarget:
      description: Where the object lives. Both are UUIDs the console read from the directory; neither is a DN.
      type: object
      required: [connectionId, namingContext]
      additionalProperties: false
      properties:
        connectionId: {type: string, format: uuid}
        namingContext: {type: string, format: uuid}
    ObjectTargetBody:
      description: The body of an Action that changes the object's state and takes no other input.
      type: object
      required: [connectionId, namingContext]
      additionalProperties: false
      properties:
        connectionId: {type: string, format: uuid}
        namingContext: {type: string, format: uuid}
    ObjectAttributeSet:
      description: Attribute name to plain-text value. A name not on the class's allow list is refused by the plan (blocked attribute_not_allowed).
      type: object
      maxProperties: 64
      additionalProperties:
        type: string
        maxLength: 1024
    ObjectUpdateBody:
      type: object
      required: [connectionId, namingContext]
      additionalProperties: false
      properties:
        connectionId: {type: string, format: uuid}
        namingContext: {type: string, format: uuid}
        set: {$ref: modules/objects.yaml#/components/schemas/ObjectAttributeSet}
        clear: {type: array, maxItems: 64, items: {type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z][A-Za-z0-9-]*$"}}
    ObjectMoveBody:
      type: object
      required: [connectionId, namingContext, newParentGuid]
      additionalProperties: false
      properties:
        connectionId: {type: string, format: uuid}
        namingContext: {type: string, format: uuid}
        newParentGuid: {type: string, format: uuid}
    ObjectRenameBody:
      type: object
      required: [connectionId, namingContext, newName]
      additionalProperties: false
      properties:
        connectionId: {type: string, format: uuid}
        namingContext: {type: string, format: uuid}
        newName: {type: string, minLength: 1, maxLength: 64}
    ObjectDeleteBody:
      type: object
      required: [connectionId, namingContext]
      additionalProperties: false
      properties:
        connectionId: {type: string, format: uuid}
        namingContext: {type: string, format: uuid}
        cascade: {type: boolean}
    ObjectRestoreBody:
      description: newParentGuid and name default to the last known parent and name the directory kept.
      type: object
      required: [connectionId, namingContext]
      additionalProperties: false
      properties:
        connectionId: {type: string, format: uuid}
        namingContext: {type: string, format: uuid}
        newParentGuid: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 64}
    UserResetPasswordBody:
      description: The new password is write-only and appears in no response, preview, event, export or log (rule 9).
      type: object
      required: [connectionId, namingContext, newPassword, mustChangeAtNextLogon]
      additionalProperties: false
      properties:
        connectionId: {type: string, format: uuid}
        namingContext: {type: string, format: uuid}
        newPassword: {$ref: shared/secret.yaml#/components/schemas/SecretInput}
        mustChangeAtNextLogon: {type: boolean}
    GroupMemberBody:
      type: object
      required: [connectionId, namingContext, memberGuid, memberClass]
      additionalProperties: false
      properties:
        connectionId: {type: string, format: uuid}
        namingContext: {type: string, format: uuid}
        memberGuid: {type: string, format: uuid}
        memberClass: {$ref: modules/objects.yaml#/components/schemas/GroupMemberClass}
    GroupScope:
      description: The scope of a new group. A closed request enum.
      type: string
      enum: [global, domain_local, universal]
    GroupMemberClass:
      description: The class of the member being added or removed. A closed request enum.
      type: string
      enum: [user, group, computer, contact]
    TemplateRef:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, minimum: 0, maximum: 1000000, description: 0 or absent means the newest published version.}

    UserCreate:
      description: A template, when given, derives sAMAccountName, userPrincipalName, cn and displayName from the attributes. initialPassword is write-only (rule 9).
      type: object
      required: [connectionId, namingContext, parentGuid, attributes, enabled]
      additionalProperties: false
      properties:
        connectionId: {type: string, format: uuid}
        namingContext: {type: string, format: uuid}
        parentGuid: {type: string, format: uuid}
        attributes: {$ref: modules/objects.yaml#/components/schemas/ObjectAttributeSet}
        enabled: {type: boolean}
        template: {$ref: modules/objects.yaml#/components/schemas/TemplateRef}
        upnSuffix: {type: string, minLength: 1, maxLength: 253}
        initialPassword: {$ref: shared/secret.yaml#/components/schemas/SecretInput}

    GroupCreate:
      type: object
      required: [connectionId, namingContext, parentGuid, name]
      additionalProperties: false
      properties:
        connectionId: {type: string, format: uuid}
        namingContext: {type: string, format: uuid}
        parentGuid: {type: string, format: uuid}
        attributes: {$ref: modules/objects.yaml#/components/schemas/ObjectAttributeSet}
        enabled: {type: boolean}
        name: {type: string, minLength: 1, maxLength: 64}
        groupScope: {$ref: modules/objects.yaml#/components/schemas/GroupScope}
        groupSecurity: {type: boolean}

    ComputerCreate:
      type: object
      required: [connectionId, namingContext, parentGuid, name]
      additionalProperties: false
      properties:
        connectionId: {type: string, format: uuid}
        namingContext: {type: string, format: uuid}
        parentGuid: {type: string, format: uuid}
        attributes: {$ref: modules/objects.yaml#/components/schemas/ObjectAttributeSet}
        enabled: {type: boolean}
        name: {type: string, minLength: 1, maxLength: 64}

    ContactCreate:
      type: object
      required: [connectionId, namingContext, parentGuid, name]
      additionalProperties: false
      properties:
        connectionId: {type: string, format: uuid}
        namingContext: {type: string, format: uuid}
        parentGuid: {type: string, format: uuid}
        attributes: {$ref: modules/objects.yaml#/components/schemas/ObjectAttributeSet}
        enabled: {type: boolean}
        name: {type: string, minLength: 1, maxLength: 64}

    OUCreate:
      type: object
      required: [connectionId, namingContext, parentGuid, name]
      additionalProperties: false
      properties:
        connectionId: {type: string, format: uuid}
        namingContext: {type: string, format: uuid}
        parentGuid: {type: string, format: uuid}
        attributes: {$ref: modules/objects.yaml#/components/schemas/ObjectAttributeSet}
        enabled: {type: boolean}
        name: {type: string, minLength: 1, maxLength: 64}

    OperationCatalogueEntry:
      type: object
      required: [action, version, permission, target, reversibility, stepUp]
      properties:
        action: {type: string, maxLength: 128, pattern: "^[a-z][a-z0-9]*(\\.[a-z][A-Za-z0-9_]*){2,4}$"}
        version: {type: integer, minimum: 1, maximum: 1000000}
        permission: {type: string, maxLength: 128}
        target: {type: string, maxLength: 32, description: Where the Action writes (directory or store). Clients accept values they do not know.}
        reversibility: {$ref: shared/operation.yaml#/components/schemas/OperationReversibilityValue}
        stepUp: {type: boolean}
    OperationCatalogue:
      type: object
      required: [actions]
      properties:
        actions: {type: array, maxItems: 1000, items: {$ref: modules/objects.yaml#/components/schemas/OperationCatalogueEntry}}

