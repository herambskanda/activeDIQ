# Object-write operations of the ad module (T-1595; ADR-0004 rule 14; Actions of T-1584, T-1585, T-1586).
# Contract first: the Actions are registered on the operation kernel (internal/modules/ad); this file is their HTTP surface.
#
# Shape. Every Action-backed write has a preview twin (POST <resource>/previews/<verb>: same tag, x-permission, parameters and body, answering the
# shared OperationPreview, which carries the diff (attribute before/after per step) and the reversibility class) and answers ActiveDIQ-Operation-Id,
# the undo handle, and 202 OperationRef when held. Each object class (user, group, computer, contact, OU) is one Action family with one undo pair
# (POST /objects/<class>/operations/{operationId}/undo and .../previews/undo), bound to the family's update permission; the kernel plans the inverse
# under the inverse Action's own permission, and an Action with no inverse (resetPassword, resetAccount) answers 409 operation-not-undoable irreversible.
#
# Every write needs Idempotency-Key. Every write on an existing object needs If-Match (the object's ETag as read): a stale value answers 412
# precondition-failed and an absent one 428 precondition-required, exactly as the existing writes. Objects are addressed by objectGuid; a DN, a raw LDAP
# filter or an attribute name that is not on the class's allow list is never accepted (a name that is not allowed is a refusal the plan reports, blocked[].code
# attribute_not_allowed). connectionId and namingContext are UUIDs the console read from the directory, not DNs.
#
# Secrets. resetPassword and user create take the password as a write-only SecretInput (rule 9). It is never in a response, a preview, an event, an
# export or a log; the preview shows only a redacted value. Reset is Irreversible: its undo does not exist.
#
# Permissions. One x-permission per operation, the Action's own (objects.<class>.<verb>; rename is a move, TM-D19). The family undo is bound to
# objects.<class>.update, the floor of the family; the inverse is planned and authorised under the permission of the inverse Action at Plan and Apply (rule 7).
# Step-up (TM-D16, TM-D30): resetPassword and computer resetAccount need a fresh MFA; an interactive caller without one is answered 401 step-up-required,
# a token or an automation is held (202, holdReason step_up).
#
# The listing GET /operations/catalogue is read-only (ADR-0003 F4): the Actions the caller holds the permission of, for the command palette.
paths:

  /objects/users/previews/create:
    post:
      tags: [objects]
      operationId: previewCreateUser
      summary: Preview create a user account
      description: >-
        The dry run of createUser as the Action ad.user.create (ADR-0004 rule 14): it plans against the live state, authorises the change for the caller and asks the gate, and answers the diff (attribute before and after per step), the reversibility class, required confirmations and whether it can be undone. It writes, persists and audits nothing, and needs no step-up.
        A refusal the plan finds is a 200 with outcome refused and blocked[].code (for example attribute_not_allowed, tier0_blocked, name_invalid), never a problem; so is a gate denial. Same x-permission, parameters and body as createUser. A secret in the body is never echoed: the preview shows a redacted value.
      x-permission: objects.user.create
      x-activediq-stability: preview
      x-activediq-limits:
        class: secret
        maxBodyBytes: 8192
      x-activediq-parity: [ADM-008]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: modules/objects.yaml#/components/schemas/UserCreate
      responses:
        "200":
          description: The preview
          content:
            application/json:
              schema:
                $ref: shared/operation.yaml#/components/schemas/OperationPreview
        "400":
          $ref: shared/problems.yaml#/components/responses/Validation
        "401":
          $ref: shared/problems.yaml#/components/responses/Unauthenticated
        "403":
          $ref: shared/problems.yaml#/components/responses/Forbidden
        "404":
          $ref: shared/problems.yaml#/components/responses/NotFound
        "413":
          $ref: shared/problems.yaml#/components/responses/PayloadTooLarge
        "415":
          $ref: shared/problems.yaml#/components/responses/UnsupportedMediaType
        "429":
          $ref: shared/problems.yaml#/components/responses/RateLimited
        "500":
          $ref: shared/problems.yaml#/components/responses/Internal
  /objects/users:
    post:
      tags: [objects]
      operationId: createUser
      summary: Create a user account
      description: >-
        Creates a user account in the container named by parentGuid. The attributes are plain text on the class's allow list; anything that grants access or changes who the object is has its own Action. This is the Action ad.user.create (ADR-0004 rule 14); preview it first with the twin previewCreateUser.
        Idempotency-Key is required: a retry with the same key and body answers what the first attempt answered; the same key with another body is refused 422 idempotency-key-reuse. The submit plans again against the live state and re-checks the caller's scope immediately before the write (ADR-0005 rule 7); a target that left the scope answers 403, not a stale success.
        The answer is the operation reference; ActiveDIQ-Operation-Id is the undo handle. The diff and the reversibility class are in the preview and in the audited operation, and a secret value is in neither.
      x-permission: objects.user.create
      x-activediq-stability: preview
      x-activediq-limits:
        class: secret
