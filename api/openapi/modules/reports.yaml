# Report operations of checkpoint 2a (T-0866; spec knowledge/product/specs/reports-2a.md 8.1, 8.3-8.6; ADR-0010).
# Contract first: no handler, database or screen exists yet. Library, run, stored-result paging, export, download and schedules.
#
# Permissions (spec 8.5). Every operation binds exactly one x-permission:
#   reports.run                   library, runs, run header, result paging
#   reports.export                export, export record, download, delete a file (createReportExport also needs reports.run, checked inside, spec 8.3)
#   reports.schedule              own schedules: list, get, create, update, pause, resume, delete, run now
#   reports.schedule.manage_all   reassign a schedule (the only operation bound to it)
# Two checks sit inside an operation and are NOT a second x-permission: reports.deliver.external, needed only when a recipient is outside the
# allowed recipient domains (schedule create and update); and reports.schedule.manage_all, needed only to list with owner=any or to act on another
# owner's schedule. createReportExport is bound to reports.export and additionally checks reports.run inside the operation (modules/reports.md 6.6 check 1),
# the same pattern as manage_all. reports.deliver.external is bound to no operation. Schedule writes are Actions (ADR-0005 rule 10, reports.schedule.*);
# runs, exports and deliveries are system bookkeeping and are not.
#
# Closed on purpose: columns are the ReportColumnId enum, filters are the typed ReportFilter tree, values are typed. There is no member that takes
# a raw filter string, a DN, SQL, or a column name that is not in the registry (FR-05). The compiler's AST is not modelled here.
# Request enums are closed; their response twins (...Value) are open (ADR-0004 rule 2).
paths:
  /reports/definitions:
    get:
      tags: [reports]
      operationId: listReportDefinitions
      summary: List the report library
      description: >-
        Answers the report definitions the caller may run, in the order the library shows them (category, then name), a page at a time.
        q finds a report by its name, its description or any ManageEngine report name it answers (spec 6.2, "Also known as"); it is plain text and is never
        a filter. The 2a library is AD only, and objects in state deleted or purged are in no report.
      x-permission: reports.run
      x-activediq-stability: preview
      x-activediq-limits:
        class: read
      x-activediq-parity: [ADM-083]
      parameters:
        - $ref: modules/reports.yaml#/components/parameters/DefinitionQuery
        - $ref: modules/reports.yaml#/components/parameters/DefinitionCategory
        - $ref: shared/paging.yaml#/components/parameters/PageCursor
        - $ref: shared/paging.yaml#/components/parameters/PageLimit
      responses:
        "200":
          description: A page of report definitions
          content:
            application/json:
              schema:
                $ref: modules/reports.yaml#/components/schemas/ReportDefinitionList
        "400":
          $ref: shared/problems.yaml#/components/responses/Validation
        "401":
          $ref: shared/problems.yaml#/components/responses/Unauthenticated
        "403":
          $ref: shared/problems.yaml#/components/responses/Forbidden
        "429":
          $ref: shared/problems.yaml#/components/responses/RateLimited
        "500":
          $ref: shared/problems.yaml#/components/responses/Internal
  /reports/definitions/{definitionId}:
    get:
      tags: [reports]
      operationId: getReportDefinition
      summary: Get a report definition
      description: >-
        Answers one definition with its presets, ManageEngine crosswalk, columns and the export formats this installation can produce.
        version selects an older published version; absent answers the current one. Definitions are immutable; a change publishes a new version (X7).
      x-permission: reports.run
      x-activediq-stability: preview
      x-activediq-limits:
        class: read
      x-activediq-parity: [ADM-083]
      parameters:
        - $ref: modules/reports.yaml#/components/parameters/DefinitionId
        - $ref: modules/reports.yaml#/components/parameters/DefinitionVersion
      responses:
        "200":
          description: The definition
          content:
            application/json:
              schema:
                $ref: modules/reports.yaml#/components/schemas/ReportDefinition
        "400":
          $ref: shared/problems.yaml#/components/responses/Validation
        "401":
          $ref: shared/problems.yaml#/components/responses/Unauthenticated
        "403":
          $ref: shared/problems.yaml#/components/responses/Forbidden
        "404":
          $ref: shared/problems.yaml#/components/responses/NotFound
        "429":
          $ref: shared/problems.yaml#/components/responses/RateLimited
        "500":
          $ref: shared/problems.yaml#/components/responses/Internal
  /reports/runs:
    post:
      tags: [reports]
      operationId: createReportRun
      summary: Create a report run
      description: >-
        Starts one run of a definition over one frozen set of inputs, as a job. A change of preset, filter, period, scope or columns is a new run; paging and
        sorting read the stored result of one run and never re-execute (spec 8.1). The runner's scope is applied inside the query, and counts are computed after
        trimming. A run is not an Action (ADR-0005 rule 10): it is system bookkeeping, audited as an event with row count and digest, never values.
        A scope that grants nothing, or uses a kind reports cannot evaluate (group_members, Entra kinds), is not an error: the run succeeds with no rows and
        the run header's emptyReason names why (spec 5, unhappy paths). Exporting from such a run is allowed (a record of what was found); only creating, updating or
        resuming a schedule from such a scope is refused, with report-scope-empty or report-scope-unsupported. Fields that are absent take the preset's value, then the definition's default.
        Reuse window (modules/reports.md 6.1 step 3, ADR-0010): when the same runner already started a run with the same query and the same applied-scope fingerprint in the last 60 seconds,
        and it is queued, running or succeeded, that run is returned instead of a new one, still 202 with the same shape. Reuse is a read and passes the same run-read gate as getReportRun.
        Job limit (step 5): a tenant with 4 runs and exports not yet finished answers 429 with errors[].code too_many_report_jobs (spec 8.3); retry when one finishes.
      x-permission: reports.run
      x-activediq-stability: preview
      x-activediq-limits:
        class: write
        maxBodyBytes: 32768
      x-activediq-parity: [ADM-083, ADM-084, ADM-085, ADM-099]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: modules/reports.yaml#/components/schemas/ReportRunCreate
      responses:
        "202":
          description: The run is accepted and queued
          headers:
            Location:
              schema:
                type: string
                maxLength: 256
          content:
            application/json:
              schema:
                $ref: modules/reports.yaml#/components/schemas/ReportRun
        "400":
          $ref: shared/problems.yaml#/components/responses/Validation
        "401":
          $ref: shared/problems.yaml#/components/responses/Unauthenticated
        "403":
          $ref: shared/problems.yaml#/components/responses/Forbidden
        "404":
          $ref: shared/problems.yaml#/components/responses/NotFound
        "413":
          $ref: shared/problems.yaml#/components/responses/PayloadTooLarge
        "415":
          $ref: shared/problems.yaml#/components/responses/UnsupportedMediaType
        "429":
          $ref: shared/problems.yaml#/components/responses/RateLimited
        "500":
          $ref: shared/problems.yaml#/components/responses/Internal
  /reports/runs/{runId}:
    get:
      tags: [reports]
      operationId: getReportRun
      summary: Get a run's header
      description: >-
        Answers the run record: state, as_of, the freshness label, row count, digest, scope applied, parameters and any failure. Poll this while the state is
        queued or running. Run-read gate (modules/reports.md 6.6, run.ReadAccess), in order: the run must belong to the caller (runner account equals the caller; the schedule's owner for a
        scheduled run), otherwise 404, which does not say whether the run exists; and the caller's current read scope must equal the scope the run was trimmed with, otherwise 409 with
        errors[].code scope_changed_rerun and the client creates a new run. A scope revoke or a narrower token therefore stops reads at once. reports.schedule.manage_all never opens a run. An expired run
        stays readable as a record with state expired; its rows are gone (ADR-0010). A failed run answers 200 with its state and failure.
      x-permission: reports.run
      x-activediq-stability: preview
      x-activediq-limits:
        class: read
      x-activediq-parity: [ADM-099]
      parameters:
        - $ref: modules/reports.yaml#/components/parameters/RunId
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                $ref: modules/reports.yaml#/components/schemas/ReportRun
        "401":
          $ref: shared/problems.yaml#/components/responses/Unauthenticated
        "403":
          $ref: shared/problems.yaml#/components/responses/Forbidden
        "404":
          $ref: shared/problems.yaml#/components/responses/NotFound
        "409":
          $ref: shared/problems.yaml#/components/responses/Conflict
        "429":
          $ref: shared/problems.yaml#/components/responses/RateLimited
        "500":
          $ref: shared/problems.yaml#/components/responses/Internal
  /reports/runs/{runId}/cancel:
    post:
      tags: [reports]
      operationId: cancelReportRun
      summary: Cancel a run
      description: >-
        Cancels a queued or running run (FR-11). Only the account that started the run may cancel it; anyone else gets 404. A run that already finished is answered unchanged. Cancelling is bookkeeping, not an Action.
      x-permission: reports.run
      x-activediq-stability: preview
      x-activediq-limits:
        class: write
      parameters:
        - $ref: modules/reports.yaml#/components/parameters/RunId
      responses:
        "200":
          description: The run after the cancel
          content:
            application/json:
              schema:
                $ref: modules/reports.yaml#/components/schemas/ReportRun
        "401":
          $ref: shared/problems.yaml#/components/responses/Unauthenticated
        "403":
          $ref: shared/problems.yaml#/components/responses/Forbidden
        "404":
          $ref: shared/problems.yaml#/components/responses/NotFound
        "429":
          $ref: shared/problems.yaml#/components/responses/RateLimited
        "500":
          $ref: shared/problems.yaml#/components/responses/Internal
  /reports/runs/{runId}/rows:
    get:
      tags: [reports]
      operationId: listReportRunRows
      summary: Page a run's stored result
      description: >-
        Reads a page of the run's stored rows. Order is the run order, or sortBy with order, then the run order as the tie-break; the cursor is bound to the sort it was issued for
        and a cursor used with another sort is a 400. The total is the run's rowCount and is never a count over the rows. The result is stored and frozen (ADR-0010 rule 3):
        a page never reflects newer data. Cells of a derived state show unknown, never an inferred value (FR-09). Run-read gate (modules/reports.md 6.6, run.ReadAccess), in order: runner account equals the caller, otherwise 404; the run is not expired, otherwise 410 report-result-expired;
        the caller's current read scope fingerprint equals the one stored with the run, otherwise 409 with errors[].code scope_changed_rerun (the client creates a new run); the run has succeeded,
        otherwise 409 with errors[].code run_not_ready (queued or running) or run_failed (failed or cancelled, with the reason). The three 409 codes are separate and a client must branch on the code, not the status.
      x-permission: reports.run
      x-activediq-stability: preview
      x-activediq-limits:
        class: read
      x-activediq-parity: [ADM-099]
      parameters:
        - $ref: modules/reports.yaml#/components/parameters/RunId
        - $ref: shared/paging.yaml#/components/parameters/PageCursor
        - $ref: shared/paging.yaml#/components/parameters/PageLimit
        - $ref: modules/reports.yaml#/components/parameters/SortBy
        - $ref: modules/reports.yaml#/components/parameters/SortOrder
      responses:
        "200":
          description: A page of rows
          content:
            application/json:
              schema:
                $ref: modules/reports.yaml#/components/schemas/ReportRowPage
        "400":
          $ref: shared/problems.yaml#/components/responses/Validation
        "401":
          $ref: shared/problems.yaml#/components/responses/Unauthenticated
        "403":
          $ref: shared/problems.yaml#/components/responses/Forbidden
        "404":
          $ref: shared/problems.yaml#/components/responses/NotFound
        "409":
          $ref: shared/problems.yaml#/components/responses/Conflict
        "410":
          $ref: shared/problems.yaml#/components/responses/ReportResultExpired
        "429":
          $ref: shared/problems.yaml#/components/responses/RateLimited
        "500":
          $ref: shared/problems.yaml#/components/responses/Internal
  /reports/runs/{runId}/exports:
    post:
      tags: [reports]
      operationId: createReportExport
      summary: Export a run
      description: >-
        Serialises the run's stored result (never a fresh query) into a file as an asynchronous job: the columns of the run, its filters, and all rows up to the format's cap (spec 8.3).
        Needs reports.export, bound as this operation's permission, and also reports.run, checked inside the operation before the run is looked up (403 if either is missing; modules/reports.md 6.6 check 1 and 7.1).
        Run-read gate (6.6, run.ReadAccess), in order: runner account equals the caller, otherwise 404; the caller's current read scope fingerprint equals the one stored with the run, otherwise 409 with
        errors[].code scope_changed_rerun (create a new run); the run has succeeded, otherwise 409 with run_not_ready or run_failed. An expired run is not refused here (see below). The three 409 codes are separate. Rows over a format's cap are refused with report-row-cap-exceeded, never truncated. A format this installation cannot produce is a 400 with code format_unavailable.
        If the run's result has expired, a new run is created first and the export says so (rerun true, rerunOfRunId); its file carries the new run's as_of. A run whose scope grants
        nothing or uses an unsupported kind is exported as a record of what was found, not refused (only schedules refuse such a scope). Exports and runs count together toward the tenant job limit: with 4 not yet
        finished the answer is 429 with errors[].code too_many_report_jobs. Exports are audited with actor and row count; an export is not an Action.
      x-permission: reports.export
      x-activediq-stability: preview
      x-activediq-limits:
        class: bulk
        maxBodyBytes: 1024
      x-activediq-parity: [ADM-100]
      parameters:
        - $ref: modules/reports.yaml#/components/parameters/RunId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: modules/reports.yaml#/components/schemas/ReportExportCreate
      responses:
        "202":
          description: The export is accepted and queued
          headers:
            Location:
              schema:
                type: string
                maxLength: 256
          content:
            application/json:
              schema:
                $ref: modules/reports.yaml#/components/schemas/ReportExport
        "400":
          $ref: shared/problems.yaml#/components/responses/Validation
        "401":
          $ref: shared/problems.yaml#/components/responses/Unauthenticated
        "403":
          $ref: shared/problems.yaml#/components/responses/Forbidden
        "404":
          $ref: shared/problems.yaml#/components/responses/NotFound
        "409":
          $ref: shared/problems.yaml#/components/responses/Conflict
        "413":
          $ref: shared/problems.yaml#/components/responses/PayloadTooLarge
        "415":
          $ref: shared/problems.yaml#/components/responses/UnsupportedMediaType
        "422":
          $ref: shared/problems.yaml#/components/responses/ReportRowCapExceeded
        "429":
          $ref: shared/problems.yaml#/components/responses/RateLimited
        "500":
          $ref: shared/problems.yaml#/components/responses/Internal
  /reports/exports/{exportId}:
    get:
      tags: [reports]
      operationId: getReportExport
      summary: Get an export's record
      description: >-
        Answers the export job: state, format, row count, size, file name, digest and expiry. Poll while the state is queued or running.
      x-permission: reports.export
      x-activediq-stability: preview
      x-activediq-limits:
        class: read
      x-activediq-parity: [ADM-100]
      parameters:
        - $ref: modules/reports.yaml#/components/parameters/ExportId
      responses:
        "200":
          description: The export
          content:
            application/json:
              schema:
                $ref: modules/reports.yaml#/components/schemas/ReportExport
        "401":
          $ref: shared/problems.yaml#/components/responses/Unauthenticated
        "403":
          $ref: shared/problems.yaml#/components/responses/Forbidden
        "404":
          $ref: shared/problems.yaml#/components/responses/NotFound
        "429":
          $ref: shared/problems.yaml#/components/responses/RateLimited
        "500":
          $ref: shared/problems.yaml#/components/responses/Internal
    delete:
      tags: [reports]
      operationId: deleteReportExport
      summary: Delete an export early
      description: >-
        Deletes the stored file before it expires (FR-20). Only the account that created it may (modules/reports.md 7.1); a recipient of a delivery of it may not, because other recipients were sent the same file. Anyone else gets 404.
        Deleting is bookkeeping, not an Action; it is audited as export deleted.
      x-permission: reports.export
      x-activediq-stability: preview
      x-activediq-limits:
        class: write
      x-activediq-parity: [ADM-100]
      parameters:
        - $ref: modules/reports.yaml#/components/parameters/ExportId
      responses:
        "204":
          description: The file is deleted
        "401":
          $ref: shared/problems.yaml#/components/responses/Unauthenticated
        "403":
          $ref: shared/problems.yaml#/components/responses/Forbidden
        "404":
          $ref: shared/problems.yaml#/components/responses/NotFound
        "429":
          $ref: shared/problems.yaml#/components/responses/RateLimited
        "500":
          $ref: shared/problems.yaml#/components/responses/Internal
  /reports/exports/{exportId}/file:
    get:
      tags: [reports]
      operationId: downloadReportExport
      summary: Download an export's file
      description: >-
        Streams the stored file, only to an authenticated request that holds reports.export, by export ID; the server resolves the ID to the export record and only the record names the blob. Two paths (modules/reports.md 7.1, 7.2).
        Creator path: the caller is the account that created the export, and the run-read gate passes for its run (runner is the caller, current read scope equals the stored one), so a scope change stops downloads too;
        a changed scope answers 409 with errors[].code scope_changed_rerun. Delivery-link path: the caller is not the creator and is the recipient of a delivery link. The right comes from the delivery record
        (DM-84 Delivery) written when the schedule fired, whose source is this export and whose recipient is the caller's account. It never comes from the schedule's current recipient list, so a recipient removed from the schedule
        can still open what that fire sent them and nothing later. The server also re-checks that the caller currently holds reports.export and that the account is enabled. The recipient gets the stored owner-scope
        artefact byte for byte; the run-read gate (runner and scope) does not apply to the recipient, because the delivery record is the authority. Anyone else, with or without reports.export, gets 404 (401 when signed out).
        The bytes are exactly the owner-scope artefact an attachment would carry, so the digest matches. The content type and file name are those of the format;
        the name is built by the download-header encoder. Every download is audited with the downloading account. An expired file answers 410 report-result-expired.
      x-permission: reports.export
      x-activediq-stability: preview
      x-activediq-limits:
        class: read
      x-activediq-parity: [ADM-100]
      parameters:
        - $ref: modules/reports.yaml#/components/parameters/ExportId
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: shared/problems.yaml#/components/responses/Unauthenticated
        "403":
          $ref: shared/problems.yaml#/components/responses/Forbidden
        "404":
          $ref: shared/problems.yaml#/components/responses/NotFound
        "409":
          $ref: shared/problems.yaml#/components/responses/Conflict
        "410":
          $ref: shared/problems.yaml#/components/responses/ReportResultExpired
        "429":
          $ref: shared/problems.yaml#/components/responses/RateLimited
        "500":
          $ref: shared/problems.yaml#/components/responses/Internal
  /reports/schedules:
    get:
      tags: [reports]
      operationId: listReportSchedules
      summary: List schedules
      description: >-
        Answers the caller's own schedules. owner=any lists every schedule of the tenant and additionally needs reports.schedule.manage_all; without it the answer is 403.
      x-permission: reports.schedule
      x-activediq-stability: preview
      x-activediq-limits:
        class: read
      x-activediq-parity: [ADM-101]
      parameters:
        - $ref: modules/reports.yaml#/components/parameters/ScheduleOwner
        - $ref: shared/paging.yaml#/components/parameters/PageCursor
        - $ref: shared/paging.yaml#/components/parameters/PageLimit
      responses:
        "200":
          description: A page of schedules
          content:
            application/json:
              schema:
                $ref: modules/reports.yaml#/components/schemas/ReportScheduleList
        "400":
          $ref: shared/problems.yaml#/components/responses/Validation
        "401":
          $ref: shared/problems.yaml#/components/responses/Unauthenticated
        "403":
          $ref: shared/problems.yaml#/components/responses/Forbidden
        "429":
          $ref: shared/problems.yaml#/components/responses/RateLimited
        "500":
          $ref: shared/problems.yaml#/components/responses/Internal
    post:
      tags: [reports]
      operationId: createReportSchedule
      summary: Create a schedule
      description: >-
        Creates a recurring run plus delivery, pinned to the definition version (spec 8.4). Creating a schedule is an Action (ADR-0005 rule 10, reports.schedule.create): it runs inline, has a
        preview diff, the gate, audit and undo, and the external-recipient confirmation is part of its preview. Operation permission: reports.schedule. Any recipient outside the tenant's allowed
        recipient domains is external; delivering to one additionally needs reports.deliver.external, and the addresses must be listed in confirmedExternal ("Data leaves your organisation"),
        or the answer is 403 (with errors[].code external_not_permitted) or 400 (code external_not_confirmed). That second permission guards the external case only. Scheduled data is what the owner
        can see, not what a recipient can see. The owner's scope is checked now: report-scope-empty or report-scope-unsupported refuses a schedule that could never deliver. The name is unique per owner,
        so a retried create is a 400 with code name_taken and changes nothing.
      x-permission: reports.schedule
      x-activediq-stability: preview
      x-activediq-limits:
        class: write
        maxBodyBytes: 32768
      x-activediq-parity: [ADM-101]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: modules/reports.yaml#/components/schemas/ReportScheduleWrite
      responses:
        "201":
          description: The schedule is created
          headers:
            ETag:
              required: true
              schema:
                type: string
                maxLength: 256
            Location:
              schema:
                type: string
                maxLength: 256
          content:
            application/json:
              schema:
                $ref: modules/reports.yaml#/components/schemas/ReportSchedule
        "400":
          $ref: shared/problems.yaml#/components/responses/Validation
        "401":
          $ref: shared/problems.yaml#/components/responses/Unauthenticated
        "403":
          $ref: shared/problems.yaml#/components/responses/Forbidden
        "404":
          $ref: shared/problems.yaml#/components/responses/NotFound
        "409":
          $ref: shared/problems.yaml#/components/responses/ReportScopeUnsupported
        "413":
          $ref: shared/problems.yaml#/components/responses/PayloadTooLarge
        "415":
          $ref: shared/problems.yaml#/components/responses/UnsupportedMediaType
        "422":
          $ref: shared/problems.yaml#/components/responses/ReportScopeEmpty
        "429":
          $ref: shared/problems.yaml#/components/responses/RateLimited
        "500":
          $ref: shared/problems.yaml#/components/responses/Internal
  /reports/schedules/{scheduleId}:
    get:
      tags: [reports]
      operationId: getReportSchedule
      summary: Get a schedule
      description: >-
        Answers one schedule with its recurrence, recipients and the delivery state of each recipient (E4), next run and last run. The ETag is the version to send as If-Match when changing it.
        Another owner's schedule is answered only with reports.schedule.manage_all (otherwise 404).
      x-permission: reports.schedule
      x-activediq-stability: preview
      x-activediq-limits:
        class: read
      x-activediq-parity: [ADM-101]
      parameters:
        - $ref: modules/reports.yaml#/components/parameters/ScheduleId
      responses:
        "200":
          description: The schedule
          headers:
            ETag:
              required: true
              schema:
                type: string
                maxLength: 256
          content:
            application/json:
              schema:
                $ref: modules/reports.yaml#/components/schemas/ReportSchedule
        "401":
          $ref: shared/problems.yaml#/components/responses/Unauthenticated
        "403":
          $ref: shared/problems.yaml#/components/responses/Forbidden
        "404":
          $ref: shared/problems.yaml#/components/responses/NotFound
        "429":
          $ref: shared/problems.yaml#/components/responses/RateLimited
        "500":
          $ref: shared/problems.yaml#/components/responses/Internal
    put:
      tags: [reports]
      operationId: updateReportSchedule
      summary: Replace a schedule's settings
      description: >-
        Replaces every writable setting, as the Action reports.schedule.update (ADR-0005 rule 10): preview diff against the current version, gate, audit, and undo that restores the previous version.
        Needs If-Match with the ETag read. The same external-recipient rule as create applies: reports.deliver.external guards the external case only, and the confirmation covers every external
        address that is new or changed. Changing another owner's schedule additionally needs reports.schedule.manage_all. The scope refusals of create apply.
      x-permission: reports.schedule
      x-activediq-stability: preview
      x-activediq-limits:
        class: write
        maxBodyBytes: 32768
      x-activediq-parity: [ADM-101]
      parameters:
        - $ref: modules/reports.yaml#/components/parameters/ScheduleId
        - $ref: modules/reports.yaml#/components/parameters/RequiredIfMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: modules/reports.yaml#/components/schemas/ReportScheduleWrite
      responses:
        "200":
          description: The schedule as stored
          headers:
            ETag:
              required: true
              schema:
                type: string
                maxLength: 256
          content:
            application/json:
              schema:
                $ref: modules/reports.yaml#/components/schemas/ReportSchedule
        "400":
          $ref: shared/problems.yaml#/components/responses/Validation
        "401":
          $ref: shared/problems.yaml#/components/responses/Unauthenticated
        "403":
          $ref: shared/problems.yaml#/components/responses/Forbidden
        "404":
          $ref: shared/problems.yaml#/components/responses/NotFound
        "409":
          $ref: shared/problems.yaml#/components/responses/ReportScopeUnsupported
        "412":
          $ref: shared/problems.yaml#/components/responses/PreconditionFailed
        "413":
          $ref: shared/problems.yaml#/components/responses/PayloadTooLarge
        "415":
          $ref: shared/problems.yaml#/components/responses/UnsupportedMediaType
        "422":
          $ref: shared/problems.yaml#/components/responses/ReportScopeEmpty
        "428":
          $ref: shared/problems.yaml#/components/responses/PreconditionRequired
        "429":
          $ref: shared/problems.yaml#/components/responses/RateLimited
        "500":
          $ref: shared/problems.yaml#/components/responses/Internal
    delete:
      tags: [reports]
      operationId: deleteReportSchedule
      summary: Delete a schedule
      description: >-
        Deletes the schedule, as the Action reports.schedule.delete (ADR-0005 rule 10), with undo that restores it. Needs If-Match. Stored artefacts of earlier runs are kept until they expire.
      x-permission: reports.schedule
      x-activediq-stability: preview
      x-activediq-limits:
        class: write
      x-activediq-parity: [ADM-101]
      parameters:
        - $ref: modules/reports.yaml#/components/parameters/ScheduleId
        - $ref: modules/reports.yaml#/components/parameters/RequiredIfMatch
      responses:
        "204":
          description: The schedule is deleted
        "401":
          $ref: shared/problems.yaml#/components/responses/Unauthenticated
        "403":
          $ref: shared/problems.yaml#/components/responses/Forbidden
        "404":
          $ref: shared/problems.yaml#/components/responses/NotFound
        "412":
          $ref: shared/problems.yaml#/components/responses/PreconditionFailed
        "428":
          $ref: shared/problems.yaml#/components/responses/PreconditionRequired
        "429":
          $ref: shared/problems.yaml#/components/responses/RateLimited
        "500":
          $ref: shared/problems.yaml#/components/responses/Internal
  /reports/schedules/{scheduleId}/pause:
    post:
      tags: [reports]
      operationId: pauseReportSchedule
      summary: Pause a schedule
      description: >-
        Pauses the schedule, as the Action reports.schedule.pause (ADR-0005 rule 10). A paused schedule fires nothing until it is resumed. Pausing another owner's schedule additionally needs reports.schedule.manage_all. A pause the system makes under the owner-authority rule is not this operation; it is audited as an event and shows as pausedReason.
      x-permission: reports.schedule
      x-activediq-stability: preview
      x-activediq-limits:
        class: write
      x-activediq-parity: [ADM-101]
      parameters:
        - $ref: modules/reports.yaml#/components/parameters/ScheduleId
      responses:
        "200":
          description: The schedule, paused
          headers:
            ETag:
              required: true
              schema:
                type: string
                maxLength: 256
          content:
            application/json:
              schema:
                $ref: modules/reports.yaml#/components/schemas/ReportSchedule
        "401":
          $ref: shared/problems.yaml#/components/responses/Unauthenticated
        "403":
          $ref: shared/problems.yaml#/components/responses/Forbidden
        "404":
          $ref: shared/problems.yaml#/components/responses/NotFound
        "429":
          $ref: shared/problems.yaml#/components/responses/RateLimited
        "500":
          $ref: shared/problems.yaml#/components/responses/Internal
  /reports/schedules/{scheduleId}/resume:
    post:
      tags: [reports]
      operationId: resumeReportSchedule
      summary: Resume a schedule
      description: >-
        Resumes a paused schedule, as the Action reports.schedule.resume (ADR-0005 rule 10). Only the owner may, after seeing the recipient list; resuming re-checks the owner's scope, with the refusals of create. A reassigned schedule stays paused until its new owner does this.
      x-permission: reports.schedule
      x-activediq-stability: preview
      x-activediq-limits:
        class: write
      x-activediq-parity: [ADM-101]
      parameters:
        - $ref: modules/reports.yaml#/components/parameters/ScheduleId
      responses:
        "200":
          description: The schedule, active
          headers:
            ETag:
              required: true
              schema:
                type: string
                maxLength: 256
          content:
            application/json:
              schema:
                $ref: modules/reports.yaml#/components/schemas/ReportSchedule
        "401":
          $ref: shared/problems.yaml#/components/responses/Unauthenticated
        "403":
          $ref: shared/problems.yaml#/components/responses/Forbidden
        "404":
          $ref: shared/problems.yaml#/components/responses/NotFound
        "409":
          $ref: shared/problems.yaml#/components/responses/ReportScopeUnsupported
        "422":
          $ref: shared/problems.yaml#/components/responses/ReportScopeEmpty
        "429":
          $ref: shared/problems.yaml#/components/responses/RateLimited
        "500":
          $ref: shared/problems.yaml#/components/responses/Internal
  /reports/schedules/{scheduleId}/owner:
    put:
      tags: [reports]
      operationId: reassignReportSchedule
      summary: Reassign a schedule's owner
      description: >-
        Hands the schedule to another account, as the Action reports.schedule.reassign (ADR-0005 rule 10). This is the one schedule operation bound to reports.schedule.manage_all. The schedule pauses until the new owner resumes it, so a reassignment cannot widen what recipients receive without the new owner's act. The new owner must hold reports.run, reports.export and reports.schedule (400 with code owner_lacks_permission otherwise). Needs If-Match.
      x-permission: reports.schedule.manage_all
      x-activediq-stability: preview
      x-activediq-limits:
        class: write
        maxBodyBytes: 1024
      x-activediq-parity: [ADM-101]
      parameters:
        - $ref: modules/reports.yaml#/components/parameters/ScheduleId
        - $ref: modules/reports.yaml#/components/parameters/RequiredIfMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: modules/reports.yaml#/components/schemas/ReportScheduleReassign
      responses:
        "200":
          description: The schedule, paused under its new owner
          headers:
            ETag:
              required: true
              schema:
                type: string
                maxLength: 256
          content:
            application/json:
              schema:
                $ref: modules/reports.yaml#/components/schemas/ReportSchedule
        "400":
          $ref: shared/problems.yaml#/components/responses/Validation
        "401":
          $ref: shared/problems.yaml#/components/responses/Unauthenticated
        "403":
          $ref: shared/problems.yaml#/components/responses/Forbidden
        "404":
          $ref: shared/problems.yaml#/components/responses/NotFound
        "412":
          $ref: shared/problems.yaml#/components/responses/PreconditionFailed
        "413":
          $ref: shared/problems.yaml#/components/responses/PayloadTooLarge
        "415":
          $ref: shared/problems.yaml#/components/responses/UnsupportedMediaType
        "428":
          $ref: shared/problems.yaml#/components/responses/PreconditionRequired
        "429":
          $ref: shared/problems.yaml#/components/responses/RateLimited
        "500":
          $ref: shared/problems.yaml#/components/responses/Internal
  /reports/schedules/{scheduleId}/runs:
    post:
      tags: [reports]
      operationId: runReportScheduleNow
      summary: Run a schedule now
      description: >-
        Fires the schedule once now, exactly as a scheduled fire: a run of the pinned definition under the owner's current scope and permissions, then delivery to each recipient, every external address re-evaluated against the
        current allowed domains. Answers the run. Only the schedule's owner may call this, because the run is the owner's and reports.schedule.manage_all never opens another owner's runs (modules/reports.md 6.6);
        anyone else, a manage_all holder included, gets 404. It is bookkeeping, not an Action. A per-DC schedule cannot be run now more often than daily (409). A schedule whose owner is disabled or has lost a permission is paused instead (409).
      x-permission: reports.schedule
      x-activediq-stability: preview
      x-activediq-limits:
        class: write
      x-activediq-parity: [ADM-101]
      parameters:
        - $ref: modules/reports.yaml#/components/parameters/ScheduleId
      responses:
        "202":
          description: The run is accepted and queued
          headers:
            Location:
              schema:
                type: string
                maxLength: 256
          content:
            application/json:
              schema:
                $ref: modules/reports.yaml#/components/schemas/ReportRun
        "401":
          $ref: shared/problems.yaml#/components/responses/Unauthenticated
        "403":
          $ref: shared/problems.yaml#/components/responses/Forbidden
        "404":
          $ref: shared/problems.yaml#/components/responses/NotFound
        "409":
          $ref: shared/problems.yaml#/components/responses/Conflict
        "429":
          $ref: shared/problems.yaml#/components/responses/RateLimited
        "500":
          $ref: shared/problems.yaml#/components/responses/Internal
components:
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      description: The run.
      schema:
        type: string
        format: uuid
    ExportId:
      name: exportId
      in: path
      required: true
      description: The export.
      schema:
        type: string
        format: uuid
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      description: The schedule.
      schema:
        type: string
        format: uuid
    DefinitionId:
      name: definitionId
      in: path
      required: true
      description: The report definition.
      schema:
        type: string
        minLength: 2
        maxLength: 64
        pattern: "^[A-Za-z][A-Za-z0-9-]{1,63}$"
    DefinitionVersion:
      name: version
      in: query
      required: false
      description: A published version of the definition. Absent answers the current one.
      schema:
        type: integer
        minimum: 1
        maximum: 1000000
    DefinitionQuery:
      name: q
      in: query
      required: false
      description: Text to find in a report name, description or ManageEngine name. Plain text only; no filter syntax.
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: "^[^()*\\\\&|=!<>~\\x00-\\x1f\\x7f]+$"
    DefinitionCategory:
      name: category
      in: query
      required: false
      description: Only reports of this category.
      schema:
        $ref: modules/reports.yaml#/components/schemas/ReportCategory
    SortBy:
      name: sortBy
      in: query
      required: false
      description: A column of the run to sort the stored result by. Absent keeps the run order.
      schema:
        $ref: modules/reports.yaml#/components/schemas/ReportColumnId
    SortOrder:
      name: order
      in: query
      required: false
      description: The sort direction. Absent is ascending.
      schema:
        $ref: modules/reports.yaml#/components/schemas/ReportSortOrder
    ScheduleOwner:
      name: owner
      in: query
      required: false
      description: me lists the caller's schedules. any lists every schedule of the tenant and needs reports.schedule.manage_all.
      schema:
        $ref: modules/reports.yaml#/components/schemas/ReportScheduleOwner
    RequiredIfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag of the schedule version being changed. A stale value answers precondition-failed; an absent one precondition-required.
      schema:
        type: string
        minLength: 1
        maxLength: 256
  schemas:
    # ---- request enums (closed) --------------------------------------------------------------
    ReportColumnId:
      description: >-
        A column of the dataset registry (DM-70) that a 2a report carries. Closed: a column name that is not listed is refused, and a column the chosen definition does not carry is a 400 with code column_not_available. The registry holds no secret attribute (D8).
      type: string
      enum: [name, logon_name, upn, status, domain, ou_path, manager, created, account_expires, days_to_expiry, last_logon, days_since, probable_service_account, real_last_logon, from_dc, dc_coverage, locked_out_since, lockout_ends, policy_source, data_as_of, password_last_set, password_expires, password_state, last_failed_logon, failures_on_dc, group_type, group_scope, direct_members, effective_members, managed_by, group, member, member_type, membership_kind, via, user, primary_group, dns_name, computer_type, operating_system, os_version, delegation, last_activity, activity_source, path, users, computers, groups, other_objects, objects_in_subtree, email]
    ReportCategory:
      description: >-
        The six categories of the 2a library (spec 6.1).
      type: string
      enum: [users, passwords, groups, computers, contacts, organizational_units]
    ReportExportFormat:
      description: >-
        An export format. csv and xlsx exist at the 2a demo; pdf and html arrive by M2 exit. A definition lists the formats this installation can produce.
      type: string
      enum: [csv, xlsx, pdf, html]
    ReportSortOrder:
      description: >-
        Sort direction.
      type: string
      enum: [asc, desc]
    ReportScheduleOwner:
      description: >-
        Whose schedules to list.
      type: string
      enum: [me, any]
    ReportFilterMatch:
      description: >-
        How a group of filters combines: all (AND), any (OR) or none (NOT any).
      type: string
      enum: [all, any, none]
    ReportCompareOperator:
      description: >-
        A comparison of one column with one typed value. contains and starts_with are literal text matches: no wildcard or pattern character has a meaning.
      type: string
      enum: [equals, not_equals, less_than, less_or_equal, greater_than, greater_or_equal, contains, starts_with]
    ReportPresence:
      description: >-
        Whether a column has a value.
      type: string
      enum: [has_value, empty]
    ReportRelativeTime:
      description: >-
        A time column relative to the time the run starts: within the last or next n days, or older than n days.
      type: string
      enum: [within_last, within_next, older_than]
    # ---- shared by request and response (no enum inside) -------------------------------------
    ReportValue:
      description: A typed filter value. Never an expression.
      oneOf:
        - $ref: modules/reports.yaml#/components/schemas/ReportValueText
        - $ref: modules/reports.yaml#/components/schemas/ReportValueInteger
        - $ref: modules/reports.yaml#/components/schemas/ReportValueBoolean
        - $ref: modules/reports.yaml#/components/schemas/ReportValueTime
        - $ref: modules/reports.yaml#/components/schemas/ReportValueEnum
      discriminator:
        propertyName: kind
    ReportValueText:
      description: >-
        Text compared literally. Control characters are refused.
      type: object
      required: [kind, value]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: text
        value:
          type: string
          maxLength: 256
          pattern: "^[^\\x00-\\x1f\\x7f]*$"
    ReportValueInteger:
      description: >-
        A whole number.
      type: object
      required: [kind, value]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: integer
        value:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
    ReportValueBoolean:
      description: >-
        A flag.
      type: object
      required: [kind, value]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: boolean
        value:
          type: boolean
    ReportValueTime:
      description: >-
        An instant, RFC 3339.
      type: object
      required: [kind, value]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: time
        value:
          type: string
          format: date-time
    ReportValueEnum:
      description: >-
        A stable ID from the column's choices, such as enabled or never_account_flag. The server checks it against the column.
      type: object
      required: [kind, value]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: enum
        value:
          type: string
          maxLength: 64
          minLength: 1
          pattern: "^[a-z][a-z0-9_]{0,63}$"
    ReportPeriod:
      description: The period a report looks at. The server refuses a range whose to is not after from, or longer than ten years.
      oneOf:
        - $ref: modules/reports.yaml#/components/schemas/ReportPeriodLastDays
        - $ref: modules/reports.yaml#/components/schemas/ReportPeriodRange
      discriminator:
        propertyName: kind
    ReportPeriodLastDays:
      description: >-
        The last n days, ending when the run starts. The presets offer 7, 30, 90, 180 and 365.
      type: object
      required: [kind, days]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: last_days
        days:
          type: integer
          minimum: 1
          maximum: 3660
    ReportPeriodRange:
      description: >-
        A custom range.
      type: object
      required: [kind, from, to]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: range
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    ReportOuRef:
      description: >-
        An organizational unit by connection and objectGUID, never by DN. oneLevel false includes the whole subtree.
      type: object
      required: [connectionId, guid, oneLevel]
      additionalProperties: false
      properties:
        connectionId:
          type: string
          format: uuid
        guid:
          type: string
          format: uuid
        oneLevel:
          type: boolean
    ReportSubjectRef:
      description: >-
        A group or user a report is about (GRP-02, GRP-03), by connection and objectGUID.
      type: object
      required: [connectionId, guid]
      additionalProperties: false
      properties:
        connectionId:
          type: string
          format: uuid
        guid:
          type: string
          format: uuid
    ReportRecurrence:
      description: When a schedule fires, in the schedule's time zone. The minimum interval is one hour (spec 8.4).
      oneOf:
        - $ref: modules/reports.yaml#/components/schemas/ReportRecurrenceHourly
        - $ref: modules/reports.yaml#/components/schemas/ReportRecurrenceDaily
        - $ref: modules/reports.yaml#/components/schemas/ReportRecurrenceWeekly
        - $ref: modules/reports.yaml#/components/schemas/ReportRecurrenceMonthlyDay
        - $ref: modules/reports.yaml#/components/schemas/ReportRecurrenceMonthlyLastDay
        - $ref: modules/reports.yaml#/components/schemas/ReportRecurrenceCustomHours
        - $ref: modules/reports.yaml#/components/schemas/ReportRecurrenceCustomDays
        - $ref: modules/reports.yaml#/components/schemas/ReportRecurrenceCustomWeeks
        - $ref: modules/reports.yaml#/components/schemas/ReportRecurrenceCustomMonths
      discriminator:
        propertyName: kind
    ReportRecurrenceHourly:
      description: >-
        Every n hours at the given minute.
      type: object
      required: [kind, everyHours, minute]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: hourly
        everyHours:
          type: integer
          minimum: 1
          maximum: 168
        minute:
          type: integer
          minimum: 0
          maximum: 59
    ReportRecurrenceDaily:
      description: >-
        Every day at a local time, HH:MM.
      type: object
      required: [kind, time]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: daily
        time:
          type: string
          maxLength: 5
          minLength: 5
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
    ReportRecurrenceWeekly:
      description: >-
        On weekdays (1 Monday to 7 Sunday) at a local time.
      type: object
      required: [kind, weekdays, time]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: weekly
        weekdays:
          type: array
          minItems: 1
          maxItems: 7
          items:
            type: integer
            minimum: 1
            maximum: 7
        time:
          type: string
          maxLength: 5
          minLength: 5
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
    ReportRecurrenceMonthlyDay:
      description: >-
        On a day of the month at a local time. A month without the day runs on its last day.
      type: object
      required: [kind, dayOfMonth, time]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: monthly_day
        dayOfMonth:
          type: integer
          minimum: 1
          maximum: 31
        time:
          type: string
          maxLength: 5
          minLength: 5
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
    ReportRecurrenceMonthlyLastDay:
      description: >-
        On the last day of every month at a local time.
      type: object
      required: [kind, time]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: monthly_last_day
        time:
          type: string
          maxLength: 5
          minLength: 5
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
    ReportRecurrenceCustomHours:
      description: >-
        From a start, repeating every n hours.
      type: object
      required: [kind, start, every]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: custom_hours
        start:
          type: string
          format: date-time
        every:
          type: integer
          minimum: 1
          maximum: 1000
    ReportRecurrenceCustomDays:
      description: >-
        From a start, repeating every n days.
      type: object
      required: [kind, start, every]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: custom_days
        start:
          type: string
          format: date-time
        every:
          type: integer
          minimum: 1
          maximum: 1000
    ReportRecurrenceCustomWeeks:
      description: >-
        From a start, repeating every n weeks.
      type: object
      required: [kind, start, every]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: custom_weeks
        start:
          type: string
          format: date-time
        every:
          type: integer
          minimum: 1
          maximum: 1000
    ReportRecurrenceCustomMonths:
      description: >-
        From a start, repeating every n months.
      type: object
      required: [kind, start, every]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: custom_months
        start:
          type: string
          format: date-time
        every:
          type: integer
          minimum: 1
          maximum: 120
    # ---- request-only shapes ----------------------------------------------------------------
    ReportFilter:
      description: >-
        A typed filter tree over registry columns. A node names a column from the closed list and a typed value; there is no expression, no raw LDAP, no SQL.
        The tree is at most four levels deep and 64 nodes; deeper is a 400 with code filter_too_complex. The server checks each operator and value against the column's type.
      oneOf:
        - $ref: modules/reports.yaml#/components/schemas/ReportFilterGroup
        - $ref: modules/reports.yaml#/components/schemas/ReportFilterCompare
        - $ref: modules/reports.yaml#/components/schemas/ReportFilterIn
        - $ref: modules/reports.yaml#/components/schemas/ReportFilterPresence
        - $ref: modules/reports.yaml#/components/schemas/ReportFilterRelative
      discriminator:
        propertyName: kind
    ReportFilterGroup:
      description: >-
        Filters combined by match.
      type: object
      required: [kind, match, filters]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: group
        match:
          $ref: modules/reports.yaml#/components/schemas/ReportFilterMatch
        filters:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportFilter
    ReportFilterCompare:
      description: >-
        One column compared with one value.
      type: object
      required: [kind, column, operator, value]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: compare
        column:
          $ref: modules/reports.yaml#/components/schemas/ReportColumnId
        operator:
          $ref: modules/reports.yaml#/components/schemas/ReportCompareOperator
        value:
          $ref: modules/reports.yaml#/components/schemas/ReportValue
    ReportFilterIn:
      description: >-
        One column equal to any of up to 50 values.
      type: object
      required: [kind, column, values]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: in
        column:
          $ref: modules/reports.yaml#/components/schemas/ReportColumnId
        values:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportValue
    ReportFilterPresence:
      description: >-
        A column has a value or is empty.
      type: object
      required: [kind, column, presence]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: presence
        column:
          $ref: modules/reports.yaml#/components/schemas/ReportColumnId
        presence:
          $ref: modules/reports.yaml#/components/schemas/ReportPresence
    ReportFilterRelative:
      description: >-
        A time column relative to the start of the run.
      type: object
      required: [kind, column, relation, days]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: relative_time
        column:
          $ref: modules/reports.yaml#/components/schemas/ReportColumnId
        relation:
          $ref: modules/reports.yaml#/components/schemas/ReportRelativeTime
        days:
          type: integer
          minimum: 1
          maximum: 3660
    ReportRunParameters:
      description: >-
        What a run is over. Every member is optional; an absent one takes the preset's value, then the definition's default. connectionIds default to every connection the runner's scope reaches. The runner's scope always applies and can only narrow what is asked.
      type: object
      required: []
      additionalProperties: false
      properties:
        connectionIds:
          type: array
          maxItems: 64
          minItems: 1
          items:
            type: string
            format: uuid
        ouInclude:
          type: array
          maxItems: 64
          minItems: 1
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportOuRef
        ouExclude:
          type: array
          maxItems: 64
          minItems: 1
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportOuRef
        period:
          $ref: modules/reports.yaml#/components/schemas/ReportPeriod
        filters:
          type: array
          maxItems: 16
          description: Combined with AND. Replaces the preset's filters when present.
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportFilter
        columns:
          type: array
          minItems: 1
          maxItems: 64
          description: The columns shown and exported, in order. Replaces the preset's columns when present.
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportColumnId
        subjects:
          type: array
          maxItems: 100
          minItems: 1
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportSubjectRef
        includeReadOnlyDcs:
          type: boolean
          description: Per-DC reports only (USR-04, PWD-03). Absent includes read-only DCs.
    ReportRunCreate:
      description: >-
        Starts a run. definitionVersion absent means the current version, which the run record then pins.
      type: object
      required: [definitionId]
      additionalProperties: false
      properties:
        definitionId:
          type: string
          minLength: 2
          maxLength: 64
          pattern: "^[A-Za-z][A-Za-z0-9-]{1,63}$"
        definitionVersion:
          type: integer
          minimum: 1
          maximum: 1000000
        presetId:
          type: string
          maxLength: 64
          minLength: 1
          pattern: "^[a-z][a-z0-9_]{0,63}$"
        parameters:
          $ref: modules/reports.yaml#/components/schemas/ReportRunParameters
    ReportExportCreate:
      description: >-
        Starts an export of the run in the path.
      type: object
      required: [format]
      additionalProperties: false
      properties:
        format:
          $ref: modules/reports.yaml#/components/schemas/ReportExportFormat
    ReportRecipientAccount:
      description: >-
        An activeDIQ account. asLink delivers a link only that account can download while signed in and holding reports.export; otherwise the file is attached.
      type: object
      required: [kind, accountId, formats, asLink]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: account
        accountId:
          type: string
          format: uuid
        formats:
          type: array
          maxItems: 4
          minItems: 1
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportExportFormat
        asLink:
          type: boolean
    ReportRecipientEmail:
      description: >-
        An e-mail address. Attachment only; a link is never offered for an address. An address outside the tenant's allowed recipient domains is external.
      type: object
      required: [kind, address, formats]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: email
        address:
          type: string
          format: email
          maxLength: 254
        formats:
          type: array
          maxItems: 4
          minItems: 1
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportExportFormat
    ReportRecipient:
      description: Who receives the schedule's files.
      oneOf:
        - $ref: modules/reports.yaml#/components/schemas/ReportRecipientAccount
        - $ref: modules/reports.yaml#/components/schemas/ReportRecipientEmail
      discriminator:
        propertyName: kind
    ReportScheduleWrite:
      description: >-
        The writable settings of a schedule. It runs the report, preset, filters, columns and scope as saved, pinned to the definition version. confirmedExternal lists the external addresses the caller confirmed in the preview (Data leaves your organisation); it must equal the set of external recipients that are new or changed.
      type: object
      required: [name, definitionId, recurrence, timeZone, recipients, notifyOnlyIfData]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 128
          minLength: 1
          pattern: "^[^\\x00-\\x1f\\x7f]+$"
        definitionId:
          type: string
          minLength: 2
          maxLength: 64
          pattern: "^[A-Za-z][A-Za-z0-9-]{1,63}$"
        definitionVersion:
          type: integer
          minimum: 1
          maximum: 1000000
        presetId:
          type: string
          maxLength: 64
          minLength: 1
          pattern: "^[a-z][a-z0-9_]{0,63}$"
        parameters:
          $ref: modules/reports.yaml#/components/schemas/ReportRunParameters
        recurrence:
          $ref: modules/reports.yaml#/components/schemas/ReportRecurrence
        timeZone:
          type: string
          maxLength: 64
          minLength: 1
          pattern: "^[A-Za-z][A-Za-z0-9_+-]*(/[A-Za-z0-9_+-]+){0,2}$"
          description: An IANA time zone name, such as Europe/Berlin.
        recipients:
          type: array
          maxItems: 50
          minItems: 1
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportRecipient
        notifyOnlyIfData:
          type: boolean
        confirmedExternal:
          type: array
          maxItems: 50
          items:
            type: string
            format: email
            maxLength: 254
    ReportScheduleReassign:
      description: >-
        Hands a schedule to another account.
      type: object
      required: [ownerAccountId]
      additionalProperties: false
      properties:
        ownerAccountId:
          type: string
          format: uuid
    # ---- response enums (open) --------------------------------------------------------------
    ReportCategoryValue:
      description: >-
        A library category. Clients accept values they do not know.
      type: string
      x-activediq-enum: open
      enum: [users, passwords, groups, computers, contacts, organizational_units]
    ReportExportFormatValue:
      description: >-
        An export format.
      type: string
      x-activediq-enum: open
      enum: [csv, xlsx, pdf, html]
    ReportColumnTypeValue:
      description: >-
        What a column holds, which decides the operators it takes.
      type: string
      x-activediq-enum: open
      enum: [text, integer, boolean, time, enum]
    ReportFilterOperatorValue:
      description: >-
        An operator a column takes, or one a preset's filter uses. within_last, within_next and older_than carry the number of days as one integer value.
      type: string
      x-activediq-enum: open
      enum: [equals, not_equals, less_than, less_or_equal, greater_than, greater_or_equal, contains, starts_with, in, has_value, empty, within_last, within_next, older_than]
    ReportFilterMatchValue:
      description: >-
        How a group of filters combines.
      type: string
      x-activediq-enum: open
      enum: [all, any, none]
    ReportFreshnessState:
      description: >-
        The freshness label of spec 8.2. per_dc_read is the only state that may be called live.
      type: string
      x-activediq-enum: open
      enum: [synced, stale, not_synced_yet, per_dc_read]
    ReportRunState:
      description: >-
        Run states (spec 8.1): queued, running, then succeeded, failed or cancelled; a succeeded run becomes expired when its result is removed.
      type: string
      x-activediq-enum: open
      enum: [queued, running, succeeded, failed, cancelled, expired]
    ReportRunStage:
      description: >-
        Where a running run is.
      type: string
      x-activediq-enum: open
      enum: [queued, compiling, reading_directory, reading_dcs, storing, done]
    ReportEmptyReason:
      description: >-
        Why a succeeded run has no rows because of scope, as opposed to its filters. scope_grants_nothing: the runner's role covers no directory objects. unsupported_scope_kind: the role's scope uses a kind 2a reports cannot evaluate, so it grants nothing (fail closed).
      type: string
      x-activediq-enum: open
      enum: [scope_grants_nothing, unsupported_scope_kind]
    ReportSkipReason:
      description: >-
        Why a connection was left out of a run.
      type: string
      x-activediq-enum: open
      enum: [not_synced_yet]
    ReportFailureReason:
      description: >-
        A typed reason for a failed run or export, the set of run.FailureReason in modules/reports.md 6.2. runner_inactive: the runner's account is disabled or gone. token_refused: the token behind the run was revoked or expired.
        row_cap_exceeded: the result is over the row cap. per_dc_read_cap_exceeded: the per-DC read cap would be passed (spec 6.5). scope_too_large: the scope cannot be rendered within limits. query_timeout: the run
        passed its time limit. connection_unavailable: a connection could not be read (per-DC reads only). definition_retired: the definition was retired before the run started. interrupted: the run job was interrupted.
        internal: anything else.
      type: string
      x-activediq-enum: open
      enum:
        - runner_inactive
        - token_refused
        - row_cap_exceeded
        - per_dc_read_cap_exceeded
        - scope_too_large
        - query_timeout
        - connection_unavailable
        - definition_retired
        - interrupted
        - internal
    ReportExportState:
      description: >-
        Export states.
      type: string
      x-activediq-enum: open
      enum: [queued, running, succeeded, failed, expired, deleted]
    ReportScheduleState:
      description: >-
        active fires on its recurrence; paused does not.
      type: string
      x-activediq-enum: open
      enum: [active, paused]
    ReportPausedReason:
      description: >-
        Why a schedule is paused. owner_disabled and owner_lost_permission are the owner-authority pauses of spec 8.4; reassigned waits for the new owner.
      type: string
      x-activediq-enum: open
      enum: [by_user, owner_disabled, owner_lost_permission, reassigned]
    ReportDeliveryStateValue:
      description: >-
        Per-recipient delivery state (DM-84).
      type: string
      x-activediq-enum: open
      enum: [none_yet, queued, sent, failed, given_up]
    ReportDeliveryReason:
      description: >-
        Why a delivery failed. external_not_permitted: the owner no longer holds reports.deliver.external. address_no_longer_allowed: the address left the allowed domains.
      type: string
      x-activediq-enum: open
      enum: [external_not_permitted, address_no_longer_allowed, attachment_too_large, mail_rejected, internal]
    ReportLastRunOutcome:
      description: >-
        How the last fire ended. nothing_to_send is a run with no rows under notify-only-if-data.
      type: string
      x-activediq-enum: open
      enum: [sent, nothing_to_send, partly_failed, failed]
    # ---- responses ---------------------------------------------------------------------------
    ReportMeName:
      description: >-
        An exact ManageEngine report name and the preset that answers it (spec 6.2).
      type: object
      required: [meName, presetId]
      properties:
        meName:
          type: string
          maxLength: 128
        presetId:
          type: string
          maxLength: 64
    ReportChoice:
      description: >-
        One value of an enum column: a stable ID and its label.
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          maxLength: 64
        label:
          type: string
          maxLength: 128
    ReportColumnInfo:
      description: >-
        A column of a definition, or of one run (a label can change with the run, such as Last logon (at least)). filterOperators are the operators the column takes.
      type: object
      required: [id, label, type, sortable, filterable, defaultVisible, filterOperators, choices]
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 1
          pattern: "^[a-z][a-z0-9_]{0,63}$"
        label:
          type: string
          maxLength: 128
        type:
          $ref: modules/reports.yaml#/components/schemas/ReportColumnTypeValue
        sortable:
          type: boolean
        filterable:
          type: boolean
        defaultVisible:
          type: boolean
        filterOperators:
          type: array
          maxItems: 16
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportFilterOperatorValue
        choices:
          type: array
          maxItems: 64
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportChoice
    ReportFilterView:
      description: A filter as the server stores it. A condition's column is a registry column ID.
      oneOf:
        - $ref: modules/reports.yaml#/components/schemas/ReportFilterGroupView
        - $ref: modules/reports.yaml#/components/schemas/ReportFilterConditionView
      discriminator:
        propertyName: kind
    ReportFilterGroupView:
      description: >-
        Filters combined by match.
      type: object
      required: [kind, match, filters]
      properties:
        kind:
          type: string
          const: group
        match:
          $ref: modules/reports.yaml#/components/schemas/ReportFilterMatchValue
        filters:
          type: array
          maxItems: 16
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportFilterView
    ReportFilterConditionView:
      description: >-
        One column, an operator and its values (none for has_value and empty).
      type: object
      required: [kind, column, operator, values]
      properties:
        kind:
          type: string
          const: condition
        column:
          type: string
          maxLength: 64
          minLength: 1
          pattern: "^[a-z][a-z0-9_]{0,63}$"
        operator:
          $ref: modules/reports.yaml#/components/schemas/ReportFilterOperatorValue
        values:
          type: array
          maxItems: 50
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportValue
    ReportPreset:
      description: >-
        A named set of filters, a period and a column set over a report (spec 6.1 rule 2). Each ManageEngine name is a preset.
      type: object
      required: [id, name, meName, filters, periodDays, columns]
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 1
          pattern: "^[a-z][a-z0-9_]{0,63}$"
        name:
          type: string
          maxLength: 128
        meName:
          type: [string, "null"]
          maxLength: 128
        filters:
          type: array
          maxItems: 16
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportFilterView
        periodDays:
          type: [integer, "null"]
          minimum: 1
          maximum: 3660
        columns:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 64
    ReportDefinitionSummary:
      description: >-
        A library entry.
      type: object
      required: [id, version, name, description, category, dataset, freshnessKind, alsoKnownAs]
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 2
        version:
          type: integer
          minimum: 1
          maximum: 1000000
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        category:
          $ref: modules/reports.yaml#/components/schemas/ReportCategoryValue
        dataset:
          type: string
          maxLength: 64
        freshnessKind:
          type: string
          maxLength: 32
        alsoKnownAs:
          type: array
          maxItems: 32
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportMeName
    ReportDefinition:
      description: >-
        A report definition: an immutable AST over one registered dataset (FR-03, FR-05), shown as its presets, crosswalk and columns. exportFormats are the formats this installation can produce, and the console offers no others. subjectKind says whether the report requires groups or users (GRP-02, GRP-03). minScheduleIntervalHours is 24 for per-DC reports.
      type: object
      required: [id, version, name, description, category, dataset, freshnessKind, alsoKnownAs, presets, columns, exportFormats, subjectKind, perDc, minScheduleIntervalHours]
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 2
        version:
          type: integer
          minimum: 1
          maximum: 1000000
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        category:
          $ref: modules/reports.yaml#/components/schemas/ReportCategoryValue
        dataset:
          type: string
          maxLength: 64
        freshnessKind:
          type: string
          maxLength: 32
        alsoKnownAs:
          type: array
          maxItems: 32
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportMeName
        presets:
          type: array
          maxItems: 32
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportPreset
        columns:
          type: array
          maxItems: 64
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportColumnInfo
        exportFormats:
          type: array
          maxItems: 4
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportExportFormatValue
        subjectKind:
          type: string
          maxLength: 16
        perDc:
          type: boolean
        minScheduleIntervalHours:
          type: integer
          minimum: 1
          maximum: 720
    ReportDefinitionList:
      description: >-
        A page of the library.
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportDefinitionSummary
        page:
          $ref: shared/paging.yaml#/components/schemas/PageInfo
    ReportParametersView:
      description: >-
        What a run or schedule is over, as stored. Period, OU and subject references and values are the request shapes; columns and filters are shown as IDs.
      type: object
      required: [connectionIds, ouInclude, ouExclude, filters, columns, subjects, includeReadOnlyDcs]
      properties:
        connectionIds:
          type: array
          maxItems: 64
          items:
            type: string
            format: uuid
        ouInclude:
          type: array
          maxItems: 64
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportOuRef
        ouExclude:
          type: array
          maxItems: 64
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportOuRef
        period:
          $ref: modules/reports.yaml#/components/schemas/ReportPeriod
        filters:
          type: array
          maxItems: 16
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportFilterView
        columns:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 64
        subjects:
          type: array
          maxItems: 100
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportSubjectRef
        includeReadOnlyDcs:
          type: boolean
    ReportFreshness:
      description: >-
        The freshness label of spec 8.2. label is the text to show, such as Synced 09:41.
      type: object
      required: [state, label]
      properties:
        state:
          $ref: modules/reports.yaml#/components/schemas/ReportFreshnessState
        label:
          type: string
          maxLength: 256
    ReportDcCoverage:
      description: >-
        How many DCs answered a per-DC report. A partial coverage makes the maximum a lower bound (spec 6.5).
      type: object
      required: [dcsInScope, dcsAnswered, complete]
      properties:
        dcsInScope:
          type: integer
          minimum: 0
          maximum: 100000
        dcsAnswered:
          type: integer
          minimum: 0
          maximum: 100000
        complete:
          type: boolean
    ReportSkippedConnection:
      description: >-
        A connection the run skipped.
      type: object
      required: [connectionId, reason]
      properties:
        connectionId:
          type: string
          format: uuid
        reason:
          $ref: modules/reports.yaml#/components/schemas/ReportSkipReason
    ReportRunProgress:
      description: >-
        Visible progress (FR-11).
      type: object
      required: [stage, percent]
      properties:
        stage:
          $ref: modules/reports.yaml#/components/schemas/ReportRunStage
        percent:
          type: integer
          minimum: 0
          maximum: 100
    ReportFailure:
      description: >-
        A typed failure. message is fixed text; it names no object.
      type: object
      required: [reason, message]
      properties:
        reason:
          $ref: modules/reports.yaml#/components/schemas/ReportFailureReason
        message:
          type: string
          maxLength: 512
    ReportRun:
      description: >-
        The run record (DM-72). asOf is the oldest sync watermark among the covered naming contexts. rowCount, objectsChecked and digest are set when the run succeeds; both counts are after scope trimming. digest is the SHA-256 over the canonical form of the stored rows (spec 8.3). scopeApplied is the human-readable summary shown in the header.
      type: object
      required: [id, definitionId, definitionVersion, presetId, state, createdBy, createdAt, startedAt, finishedAt, expiresAt, asOf, freshness, rowCount, objectsChecked, digest, scopeApplied, skippedConnections, progress, parameters]
      properties:
        id:
          type: string
          format: uuid
        definitionId:
          type: string
          maxLength: 64
          minLength: 2
        definitionVersion:
          type: integer
          minimum: 1
          maximum: 1000000
        presetId:
          type: [string, "null"]
          maxLength: 64
        state:
          $ref: modules/reports.yaml#/components/schemas/ReportRunState
        createdBy:
          $ref: shared/job.yaml#/components/schemas/JobActor
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        expiresAt:
          type: [string, "null"]
          format: date-time
        asOf:
          type: [string, "null"]
          format: date-time
        freshness:
          $ref: modules/reports.yaml#/components/schemas/ReportFreshness
        rowCount:
          type: [integer, "null"]
          minimum: 0
          maximum: 9007199254740991
        objectsChecked:
          type: [integer, "null"]
          minimum: 0
          maximum: 9007199254740991
        digest:
          type: [string, "null"]
          maxLength: 64
          pattern: "^[0-9a-f]{64}$"
        scopeApplied:
          type: [string, "null"]
          maxLength: 1024
        emptyReason:
          $ref: modules/reports.yaml#/components/schemas/ReportEmptyReason
        skippedConnections:
          type: array
          maxItems: 64
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportSkippedConnection
        progress:
          $ref: modules/reports.yaml#/components/schemas/ReportRunProgress
        failure:
          $ref: modules/reports.yaml#/components/schemas/ReportFailure
        coverage:
          $ref: modules/reports.yaml#/components/schemas/ReportDcCoverage
        rerunOf:
          type: string
          format: uuid
        parameters:
          $ref: modules/reports.yaml#/components/schemas/ReportParametersView
    ReportCell:
      description: >-
        One typed cell; the kinds map one to one onto report.Cell in modules/reports.md 6.2 (text s, integer i, boolean b, time t, enum e, guid g, textList l, absent a, never n). unknown is shown rather than an inferred
        value when an input is missing (FR-09). absent is a missing value, distinct from empty text; never is a value that cannot occur, such as a last logon of an account that has never logged on.
      oneOf:
        - $ref: modules/reports.yaml#/components/schemas/ReportCellText
        - $ref: modules/reports.yaml#/components/schemas/ReportCellInteger
        - $ref: modules/reports.yaml#/components/schemas/ReportCellGuid
        - $ref: modules/reports.yaml#/components/schemas/ReportCellTextList
        - $ref: modules/reports.yaml#/components/schemas/ReportCellNever
        - $ref: modules/reports.yaml#/components/schemas/ReportValueBoolean
        - $ref: modules/reports.yaml#/components/schemas/ReportValueTime
        - $ref: modules/reports.yaml#/components/schemas/ReportValueEnum
        - $ref: modules/reports.yaml#/components/schemas/ReportCellAbsent
        - $ref: modules/reports.yaml#/components/schemas/ReportCellUnknown
      discriminator:
        propertyName: kind
    ReportCellText:
      description: >-
        Text as stored in the directory, which may hold any character. Encoders neutralise it on export.
      type: object
      required: [kind, value]
      properties:
        kind:
          type: string
          const: text
        value:
          type: string
          maxLength: 4096
    ReportCellInteger:
      description: >-
        A whole number as a decimal string, so 64-bit directory values stay exact.
      type: object
      required: [kind, value]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: integer
        value:
          type: string
          maxLength: 20
          pattern: "^-?[0-9]{1,19}$"
    ReportCellGuid:
      description: >-
        An object GUID or other GUID attribute, canonical lower-case.
      type: object
      required: [kind, value]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: guid
        value:
          type: string
          format: uuid
    ReportCellTextList:
      description: >-
        A multi-valued text attribute, in stored order.
      type: object
      required: [kind, value]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: textList
        value:
          type: array
          maxItems: 1000
          items:
            type: string
            maxLength: 4096
    ReportCellNever:
      description: >-
        The value can never exist for this object, as distinct from absent (not yet set).
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: never
    ReportCellAbsent:
      description: >-
        No value.
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          const: absent
    ReportCellUnknown:
      description: >-
        A derived state whose input is missing (Unknown (input missing)).
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          const: unknown
    ReportRow:
      description: >-
        One row of a stored result. rowKey is the object GUID or edge key; cells follow the page's columns.
      type: object
      required: [rowKey, cells]
      properties:
        rowKey:
          type: string
          maxLength: 128
          minLength: 1
        cells:
          type: array
          maxItems: 64
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportCell
    ReportRowPage:
      description: >-
        A page of a stored result. rowCount is the run's total after trimming.
      type: object
      required: [runId, columns, rows, rowCount, page]
      properties:
        runId:
          type: string
          format: uuid
        columns:
          type: array
          maxItems: 64
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportColumnInfo
        rows:
          type: array
          maxItems: 1000
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportRow
        rowCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        page:
          $ref: shared/paging.yaml#/components/schemas/PageInfo
    ReportExport:
      description: >-
        An export job and its stored file (DM-72.I3). When the run's result had expired, rerun is true, runId is the new run and rerunOfRunId the expired one; the file carries the new run's as_of.
      type: object
      required: [id, runId, format, state, createdBy, createdAt, finishedAt, expiresAt, rowCount, byteSize, digest, fileName, rerun]
      properties:
        id:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        rerunOfRunId:
          type: string
          format: uuid
        format:
          $ref: modules/reports.yaml#/components/schemas/ReportExportFormatValue
        state:
          $ref: modules/reports.yaml#/components/schemas/ReportExportState
        createdBy:
          $ref: shared/job.yaml#/components/schemas/JobActor
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        expiresAt:
          type: [string, "null"]
          format: date-time
        rowCount:
          type: [integer, "null"]
          minimum: 0
          maximum: 9007199254740991
        byteSize:
          type: [integer, "null"]
          minimum: 0
          maximum: 9007199254740991
        digest:
          type: [string, "null"]
          maxLength: 64
          pattern: "^[0-9a-f]{64}$"
        fileName:
          type: [string, "null"]
          maxLength: 256
        rerun:
          type: boolean
        failure:
          $ref: modules/reports.yaml#/components/schemas/ReportFailure
    ReportDeliveryState:
      description: >-
        The delivery of the latest fire to one recipient.
      type: object
      required: [state, updatedAt]
      properties:
        state:
          $ref: modules/reports.yaml#/components/schemas/ReportDeliveryStateValue
        reason:
          $ref: modules/reports.yaml#/components/schemas/ReportDeliveryReason
        updatedAt:
          type: [string, "null"]
          format: date-time
    ReportRecipientAccountView:
      description: >-
        An account recipient.
      type: object
      required: [kind, accountId, formats, asLink, delivery]
      properties:
        kind:
          type: string
          const: account
        accountId:
          type: string
          format: uuid
        formats:
          type: array
          maxItems: 4
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportExportFormatValue
        asLink:
          type: boolean
        delivery:
          $ref: modules/reports.yaml#/components/schemas/ReportDeliveryState
    ReportRecipientEmailView:
      description: >-
        An e-mail recipient. external is judged against the allowed recipient domains now.
      type: object
      required: [kind, address, formats, external, delivery]
      properties:
        kind:
          type: string
          const: email
        address:
          type: string
          format: email
          maxLength: 254
        formats:
          type: array
          maxItems: 4
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportExportFormatValue
        external:
          type: boolean
        delivery:
          $ref: modules/reports.yaml#/components/schemas/ReportDeliveryState
    ReportRecipientView:
      description: A recipient as stored.
      oneOf:
        - $ref: modules/reports.yaml#/components/schemas/ReportRecipientAccountView
        - $ref: modules/reports.yaml#/components/schemas/ReportRecipientEmailView
      discriminator:
        propertyName: kind
    ReportLastRun:
      description: >-
        The latest fire.
      type: object
      required: [runId, startedAt, outcome]
      properties:
        runId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        outcome:
          $ref: modules/reports.yaml#/components/schemas/ReportLastRunOutcome
    ReportSchedule:
      description: >-
        A schedule (DM-73). Recipients receive what the owner can see, not what they can see. The ETag header is the version for If-Match.
      type: object
      required: [id, name, ownerAccountId, definitionId, definitionVersion, presetId, parameters, recurrence, timeZone, recipients, notifyOnlyIfData, state, nextRunAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 128
        ownerAccountId:
          type: string
          format: uuid
        definitionId:
          type: string
          maxLength: 64
          minLength: 2
        definitionVersion:
          type: integer
          minimum: 1
          maximum: 1000000
        presetId:
          type: [string, "null"]
          maxLength: 64
        parameters:
          $ref: modules/reports.yaml#/components/schemas/ReportParametersView
        recurrence:
          $ref: modules/reports.yaml#/components/schemas/ReportRecurrence
        timeZone:
          type: string
          maxLength: 64
        recipients:
          type: array
          maxItems: 50
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportRecipientView
        notifyOnlyIfData:
          type: boolean
        state:
          $ref: modules/reports.yaml#/components/schemas/ReportScheduleState
        pausedReason:
          $ref: modules/reports.yaml#/components/schemas/ReportPausedReason
        nextRunAt:
          type: [string, "null"]
          format: date-time
        lastRun:
          $ref: modules/reports.yaml#/components/schemas/ReportLastRun
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReportScheduleList:
      description: >-
        A page of schedules.
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            $ref: modules/reports.yaml#/components/schemas/ReportSchedule
        page:
          $ref: shared/paging.yaml#/components/schemas/PageInfo
