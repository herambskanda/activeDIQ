# Help-desk caller verification (T-2145; ENH-09 spec §4, §4a, DM-38; engine internal/modules/helpdesk, T-1602).
# A technician with no AD rights issues a one-time code to a contact factor the directory already holds for the caller,
# types in what the caller reads back, and a verified challenge then stands in for the technician's own step-up on
# the reset and unlock Actions.
#
# Both routes are POST and nothing else (T-0719 C1): loading a page, a reload, back/forward, prefetch or a deep link
# can never send a code. A console session must carry X-CSRF-Token (apihost chain step 9); a bearer token is refused
# 403 by the handler, because the verifier is a human at the console (the technician is the audit actor, DM-38.I4).
# Both need Idempotency-Key. Per-IP and per-session limits apply in the handler on top of the engine's own caps.
#
# Permission: helpdesk.caller.verify, held by the built-in help-desk-operator and platform-administrator roles. It is not
# objects.user.reset_password: that is a step-up permission (TM-D16), and the proof here is what replaces the technician's MFA.
# The engine's own check (reset permission scoped to the target's OU, P8) decides per target and is never a distinct answer.
paths:
  /helpdesk/caller-verifications:
    post:
      tags: [helpdesk]
      operationId: issueCallerVerification
      summary: Send a verification code to the caller
      description: >-
        Sends a one-time code to the destination the directory holds for the target (email or SMS); the technician never
        supplies or sees an address, only a masked form. This is a user act, never made on page render. Opening the sheet
        again attaches to the technician's open challenge (reused true) and sends nothing; resend true is the only way to a
        second code and supersedes the first.

        Idempotency-Key is required. A retry with the same key and body answers what the first attempt answered and sends
        nothing; the same key with a different body is refused 422 idempotency-key-reuse; a retry while the first request is
        still running is 409. Only a success is remembered, so a refused request is evaluated again on a retry.

        Refusals. 422 caller-verification-unavailable is one answer, with identical status, body and timing class, for an
        unknown, disabled, out-of-scope, protected or self target and for a target with no held destination for the factor;
        it never says which. 429 caller-verification-limit with errors[].code quota (the hourly issue limit of the target or
        the technician) or paused (too many failed challenges; try later). 502 caller-verification-delivery-failed when the
        message could not be sent: no code exists and the issue does not count. 429 rate-limited when the session or source
        address is over its limit. 403 for a token principal or a missing permission.
      x-permission: helpdesk.caller.verify
      x-activediq-stability: preview
      x-activediq-limits:
        class: write
        maxBodyBytes: 1024
      x-activediq-parity: [ADM-136]
      parameters:
        - $ref: modules/helpdesk.yaml#/components/parameters/CallerVerificationKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: modules/helpdesk.yaml#/components/schemas/IssueCallerVerificationRequest
            examples:
              open:
                summary: Open the sheet for a caller
                value:
                  connectionId: 5b0e7c1a-3d2f-4a6b-8c9d-1e2f3a4b5c6d
                  objectGuid: 3f9c1e52-7a4b-4d0e-9b1a-0c5e8d2a6f10
                  factor: email_otp
      responses:
        "200":
          description: The challenge the technician sees. It never carries the code.
          content:
            application/json:
              schema:
                $ref: modules/helpdesk.yaml#/components/schemas/CallerVerificationChallenge
              examples:
                sent:
                  value:
                    challengeId: 8a1d6f40-2b7e-4c93-a5d1-7e0b9c3f2a64
                    factor: email_otp
                    destinationMasked: p***@corp.example.test
                    expiresAt: "2026-11-15T09:15:00Z"
                    reused: false
        "400":
          $ref: shared/problems.yaml#/components/responses/Validation
        "401":
          $ref: shared/problems.yaml#/components/responses/Unauthenticated
        "403":
          $ref: shared/problems.yaml#/components/responses/Forbidden
        "409":
          $ref: shared/problems.yaml#/components/responses/Conflict
        "413":
          $ref: shared/problems.yaml#/components/responses/PayloadTooLarge
        "415":
          $ref: shared/problems.yaml#/components/responses/UnsupportedMediaType
        "422":
          $ref: shared/problems.yaml#/components/responses/CallerVerificationUnavailable
        "429":
          $ref: shared/problems.yaml#/components/responses/CallerVerificationLimit
        "500":
          $ref: shared/problems.yaml#/components/responses/Internal
        "502":
          $ref: shared/problems.yaml#/components/responses/CallerVerificationDeliveryFailed
  /helpdesk/caller-verifications/{challengeId}/verify:
    post:
      tags: [helpdesk]
      operationId: verifyCallerVerification
      summary: Check the code the caller read back
      description: >-
        Checks the code against the challenge. Every attempt is charged before the code is compared, so three attempts at
        most are possible per challenge whatever the concurrency.

        Every failure answers one 422 caller-verification-refused with the same status, body and timing class, whether the
        code was wrong, the attempts are used up, the challenge expired, was superseded or never existed, or belongs to
        another technician: a client cannot tell a wrong code from a cap. The code travels only in this body, never in a
        URL, and no response, log line or audit event repeats it.

        Idempotency-Key is required. A retry with the same key and code replays the first answer, a pass or the refusal, and
        charges no second attempt; the same key with a different code is 422 idempotency-key-reuse.
      x-permission: helpdesk.caller.verify
      x-activediq-stability: preview
      x-activediq-limits:
        class: secret
        maxBodyBytes: 256
      x-activediq-parity: [ADM-136]
      parameters:
        - $ref: modules/helpdesk.yaml#/components/parameters/CallerVerificationChallengeId
        - $ref: modules/helpdesk.yaml#/components/parameters/CallerVerificationKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: modules/helpdesk.yaml#/components/schemas/VerifyCallerVerificationRequest
            examples:
              code:
                value:
                  code: "042917"
      responses:
        "200":
          description: The caller is verified. The challenge may authorise one reset or unlock until authorisedUntil.
          content:
            application/json:
              schema:
                $ref: modules/helpdesk.yaml#/components/schemas/CallerVerified
        "400":
          $ref: shared/problems.yaml#/components/responses/Validation
        "401":
          $ref: shared/problems.yaml#/components/responses/Unauthenticated
        "403":
          $ref: shared/problems.yaml#/components/responses/Forbidden
        "409":
          $ref: shared/problems.yaml#/components/responses/Conflict
        "413":
          $ref: shared/problems.yaml#/components/responses/PayloadTooLarge
        "415":
          $ref: shared/problems.yaml#/components/responses/UnsupportedMediaType
        "422":
          $ref: shared/problems.yaml#/components/responses/CallerVerificationRefused
        "429":
          $ref: shared/problems.yaml#/components/responses/RateLimited
        "500":
          $ref: shared/problems.yaml#/components/responses/Internal
components:
  parameters:
    CallerVerificationChallengeId:
      name: challengeId
      in: path
      required: true
      description: The challenge returned by issueCallerVerification.
      schema:
        type: string
        format: uuid
    CallerVerificationKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Makes a retry safe. Honoured for 24 hours per technician and operation.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9._~-]+$
  schemas:
    CallerVerificationFactor:
      description: How the caller was verified. Clients ignore values they do not know.
      type: string
      enum: [email_otp, sms_otp]
      x-activediq-enum: open
    CallerVerificationFactorSetting:
      description: The factor a technician asks for. totp is reserved for the enrolment work and is not accepted until then.
      type: string
      enum: [email_otp, sms_otp]
    IssueCallerVerificationRequest:
      type: object
      required: [connectionId, objectGuid, factor]
      additionalProperties: false
      properties:
        connectionId:
          type: string
          format: uuid
          description: The directory connection the caller's account belongs to.
        objectGuid:
          type: string
          format: uuid
          description: The caller's objectGUID. A DN is never accepted.
        factor:
          $ref: modules/helpdesk.yaml#/components/schemas/CallerVerificationFactorSetting
        resend:
          type: boolean
          description: True only for the explicit "Send a new code" act; it supersedes the open challenge.
    CallerVerificationChallenge:
      type: object
      required: [challengeId, factor, destinationMasked, expiresAt, reused]
      properties:
        challengeId:
          type: string
          format: uuid
        factor:
          $ref: modules/helpdesk.yaml#/components/schemas/CallerVerificationFactor
        destinationMasked:
          type: string
          maxLength: 256
          description: Where the code went, masked. The full address is never returned.
        expiresAt:
          type: string
          format: date-time
        reused:
          type: boolean
          description: True when an open challenge was attached to, or this is a replay of an earlier identical request; nothing was sent now.
    VerifyCallerVerificationRequest:
      description: The six digits the caller read back, held as a secret and destroyed after the request.
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          $ref: shared/secret.yaml#/components/schemas/SecretInput
    CallerVerified:
      type: object
      required: [challengeId, authorisedUntil]
      properties:
        challengeId:
          type: string
          format: uuid
        authorisedUntil:
          type: string
          format: date-time
          description: Until when the challenge may authorise one reset or unlock for this target.
