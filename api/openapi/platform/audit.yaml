# Admin read of the audit trail (T-2300; impersonate-as-admin-attribution.md sections 5-6). One read-only operation: search the
# tenant's chained events by DC, DM-11 credential, target GUID and time, so an auditor can join a line of a DC's own log to the
# technician (Requester, Via) who caused it. Permission audit.read, no step-up (a read, and the chain holds no personal value:
# ADR-0005 rule 11). Every filter is typed; no LDAP filter, DN or query text is accepted.
paths:
  /audit/events:
    get:
      tags: [platform.audit]
      operationId: listAuditEvents
      summary: Search audit events
      description: >-
        Answers the tenant's audit events, oldest first by chain position (seq), filtered by any combination of dc, credentialId,
        target and the time range from (inclusive) to (exclusive). dc and credentialId match the public details the runner stamps on
        every step event that wrote to a directory (T-1629); they are matched exactly, case-insensitively for dc. The answer carries
        the event's Requester and Via, the chain principals behind it, and never an attribute value (values are personal data kept
        outside the chain).

        Paging. The page is bounded by the work the server does, not only by limit: a page may carry fewer than limit items, or none,
        and still carry a nextCursor when more of the chain remains to be searched. Keep following nextCursor until it is null. A
        cursor is opaque and is only valid with the same filters.

        The read is itself audited (kind audit.queried, with the filters used and the count returned), and a caller without
        audit.read is refused with 403 and the refusal is recorded (authz.permission.denied).
      x-permission: audit.read
      x-activediq-stability: preview
      x-activediq-limits:
        class: read
      parameters:
        - name: dc
          in: query
          required: false
          description: The domain controller the step was written on, as stamped on the event (a host name).
          schema:
            type: string
            minLength: 1
            maxLength: 253
        - name: credentialId
          in: query
          required: false
          description: The DM-11 credential ID the step was transported by.
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: target
          in: query
          required: false
          description: The objectGUID of the event's target.
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          description: Only events at or after this time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Only events before this time.
          schema:
            type: string
            format: date-time
        - $ref: shared/paging.yaml#/components/parameters/PageCursor
        - name: limit
          in: query
          required: false
          description: The page size. The default is 100.
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: A page of events
          content:
            application/json:
              schema:
                $ref: platform/audit.yaml#/components/schemas/AuditEventList
        "400":
          $ref: shared/problems.yaml#/components/responses/Validation
        "401":
          $ref: shared/problems.yaml#/components/responses/Unauthenticated
        "403":
          $ref: shared/problems.yaml#/components/responses/Forbidden
        "429":
          $ref: shared/problems.yaml#/components/responses/RateLimited
        "500":
          $ref: shared/problems.yaml#/components/responses/Internal
components:
  schemas:
    AuditPrincipal:
      description: A principal of the chain. The kind is open and clients ignore values they do not know.
      type: object
      required: [id, kind]
      properties:
        id:
          type: string
          maxLength: 256
        kind:
          type: string
          maxLength: 64
    AuditEvent:
      description: One chained event, without any attribute value. Members that do not apply to the event are absent.
      type: object
      required: [seq, eventId, kind, at, requester, via, component, outcome]
      properties:
        seq:
          description: The position in the tenant's chain.
          $ref: shared/scalars.yaml#/components/schemas/Int64String
        eventId:
          type: string
          maxLength: 200
        kind:
          type: string
          maxLength: 200
        at:
          type: string
          format: date-time
        requester:
          $ref: platform/audit.yaml#/components/schemas/AuditPrincipal
        via:
          description: The principals the request passed through, nearest the requester first.
          type: array
          maxItems: 16
          items:
            $ref: platform/audit.yaml#/components/schemas/AuditPrincipal
        component:
          type: string
          maxLength: 128
        connection:
          type: string
          maxLength: 64
          description: The connection the target belongs to, when it has one.
        target:
          type: string
          maxLength: 64
          description: The objectGUID of the target, when the event has one.
        targetClass:
          type: string
          maxLength: 64
        operation:
          type: string
          maxLength: 64
          description: The operation of a step event.
        item:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        step:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        outcome:
          type: string
          maxLength: 32
          description: success, failure or denied. The set is open and clients ignore values they do not know.
        reason:
          type: string
          maxLength: 128
        planHash:
          type: string
          maxLength: 128
        dc:
          type: string
          maxLength: 253
          description: The domain controller a directory-write step was applied on.
        credentialId:
          type: string
          maxLength: 128
          description: The DM-11 credential the step was transported by. Never the bind account name or SID.
    AuditEventList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            $ref: platform/audit.yaml#/components/schemas/AuditEvent
        nextCursor:
          type: [string, "null"]
          maxLength: 1024
