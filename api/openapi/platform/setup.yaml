paths:
  /setup/claim:
    post:
      tags: [platform.setup]
      operationId: claimFirstRunSetup
      summary: Claim first-run setup and create the first tenant owner (AN-4)
      description: >-
        The first-run setup gate (TM-TB16-T7). A fresh install writes a one-time setup secret where only the
        installing administrator can read it (`activediq-server setup show`). Presenting it here claims
        setup: in one step the secret is consumed and the first tenant-owner account is created and granted
        the tenant-owner role (a failure creating the owner leaves the secret unconsumed). The secret never
        works again. The new account has no credential yet and cannot sign in until one is enrolled. Success
        answers 204 and no body. A second claim is refused like any other failure. Every failure has one shape, 401 /problems/setup-refused: wrong secret, expired secret,
        already-used secret, and an install that is not in first-run state are indistinguishable. The
        source-IP limiter may answer 429. No default account exists before or after.
      x-permission: anonymous
      x-activediq-scope: platform
      x-activediq-anonymous: AN-4
      x-activediq-stability: preview
      x-activediq-limits:
        class: auth
        maxBodyBytes: 4096
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: platform/setup.yaml#/components/schemas/SetupClaimRequest
      responses:
        "204":
          description: Setup was claimed, the secret is consumed and the first tenant owner exists.
        "400":
          $ref: shared/problems.yaml#/components/responses/Validation
        "401":
          $ref: shared/problems.yaml#/components/responses/SetupRefused
        "413":
          $ref: shared/problems.yaml#/components/responses/PayloadTooLarge
        "415":
          $ref: shared/problems.yaml#/components/responses/UnsupportedMediaType
        "429":
          $ref: shared/problems.yaml#/components/responses/RateLimited
        "500":
          $ref: shared/problems.yaml#/components/responses/Internal
components:
  schemas:
    SetupClaimRequest:
      description: The one-time setup secret and the details of the first tenant owner.
      type: object
      additionalProperties: false
      required: [secret, owner]
      properties:
        secret:
          $ref: shared/secret.yaml#/components/schemas/SecretInput
        owner:
          $ref: platform/setup.yaml#/components/schemas/SetupOwner
    SetupOwner:
      description: The first tenant owner's account details.
      type: object
      additionalProperties: false
      required: [displayName, email]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          minLength: 3
          maxLength: 320
