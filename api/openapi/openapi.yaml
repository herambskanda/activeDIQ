# The root of the activeDIQ public API contract (ADR-0004 rule 1). One OpenAPI 3.1 document, split
# into one file per tag and bundled by tools/gen/api into
# internal/platform/apihost/spec/openapi.gen.json. Edit this file for info, servers, security
# schemes and the tag list; paths and components live in the tag files and in shared/.
#
# A tag's file is derived from its name: tag `objects` is modules/objects.yaml, tag
# `platform.authn` is platform/authn.yaml. Add an entry below with the file.
openapi: 3.1.0
info:
  title: activeDIQ API
  version: 0.0.0
  description: >-
    The one public API of activeDIQ. The console, scripts, ITSM integrations and the PowerShell
    module all call these operations. There is one version, /api/v1, and it only grows.
servers:
  - url: /api/v1
security:
  - bearer: []
  - sessionCookie: []
    csrfToken: []
tags:
  - name: platform.health
    description: Liveness and readiness of the service, for load balancers and orchestrators. Status only; no version or configuration detail.
  - name: platform.authn
    description: Sign-in, second factor and sign-out for the console. A first factor yields a pending sign-in; only the second factor creates a session.
  - name: platform.setup
    description: First-run setup. The one-time setup secret claims setup once; it expires and is consumed on first use.
  - name: connections
    description: Directory connections. Attestation of an Entra connection's takeover protection (TM-D17), its maximum age, and the IdP callback.
  - name: platform.notify
    description: Notification sinks. SIEM syslog destinations; TLS by default, plaintext only by an audited opt-in. No destination can be deleted.
  - name: delegation
    description: Roles and assignments. The input contracts of the delegation.* control-plane Actions; personal to an account, step-up required.
  - name: directory
    description: Read-only directory queries. Universal search (grouped, ranked, trimmed to the caller's scope) and user search by plain text; permission directory.read.
  - name: reports
    description: Canned reports. The library, runs over a frozen result, paging and export of a stored run, and schedules with delivery. Permissions reports.run, reports.export, reports.schedule and reports.schedule.manage_all.
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: adq_ API token
      description: A scoped API token in the Authorization header. Credentials never travel in a query string.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-adiq_session
      description: The console session cookie (HttpOnly, Secure, SameSite=Strict).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required with the session cookie on POST, PUT, PATCH and DELETE. Bearer-token requests are exempt.
