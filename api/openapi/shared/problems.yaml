# The closed problem catalogue (ADR-0004 rule 8, api-design reference/conventions.md §2). Every 4xx
# and 5xx response is application/problem+json with the Problem schema. Each entry under
# components.responses is one slug: its example carries type, title and status, and tools/gen/api
# emits one apitypes constructor per slug from it. Adding a slug is an additive contract change.
components:
  schemas:
    ProblemErrorIn:
      description: Where a violation was found.
      type: string
      x-activediq-enum: open
      enum: [body, path, query, header]
    ProblemError:
      description: One violation. pointer is a JSON Pointer inside the body, or the parameter name.
      type: object
      required: [in, pointer, code, detail]
      properties:
        in:
          $ref: shared/problems.yaml#/components/schemas/ProblemErrorIn
        pointer:
          type: string
          maxLength: 1024
        code:
          type: string
          maxLength: 64
        detail:
          type: string
          maxLength: 512
        item:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: For a bulk request, the index of the item the violation belongs to.
    ProblemDirectory:
      description: The directory's own result, with secrets stripped. Never raw LDAP text with internals.
      type: object
      required: [resultCode, diagnostic]
      properties:
        resultCode:
          type: integer
          minimum: 0
          maximum: 65535
        diagnostic:
          type: string
          maxLength: 512
    Problem:
      description: An RFC 9457 problem. type is a relative reference, /problems/<slug>, from a closed catalogue.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          pattern: ^/problems/[a-z][a-z0-9-]*$
          maxLength: 100
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 2048
        instance:
          type: string
          maxLength: 2048
        code:
          type: string
          maxLength: 100
        traceId:
          type: string
          maxLength: 64
        errors:
          type: array
          maxItems: 1000
          items:
            $ref: shared/problems.yaml#/components/schemas/ProblemError
        directory:
          $ref: shared/problems.yaml#/components/schemas/ProblemDirectory
  responses:
    Validation:
      description: The request is invalid
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/validation
            title: The request is invalid
            status: 400
    MalformedRequest:
      description: The request is malformed
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/malformed-request
            title: The request is malformed
            status: 400
    Unauthenticated:
      description: Authentication is required
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/unauthenticated
            title: Authentication is required
            status: 401
    StepUpRequired:
      description: A fresh multi-factor check is required
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/step-up-required
            title: A fresh multi-factor check is required
            status: 401
    StepUpRefused:
      description: >-
        The step-up re-verification did not succeed. One answer for every cause (wrong, replayed or paused
        code, no enrolled factor, an account that is no longer active, a spent failure budget), so the
        response teaches a caller nothing about which enrolment exists or matched (TM-D16, TM-D30). It never
        carries a detail or an errors member.
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/step-up-refused
            title: Step-up verification refused
            status: 403
    SignInFailed:
      description: >-
        The sign-in did not succeed. One answer for every cause (unknown account, wrong secret, non-local
        account, disabled account, throttled account, expired or exhausted pending sign-in), so the response
        teaches a caller nothing (TM section 7.6 rule 2). It never carries a detail.
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/sign-in-failed
            title: Sign-in failed
            status: 401
    SetupRefused:
      description: >-
        First-run setup was not claimed. One answer for every cause (wrong secret, expired secret, secret
        already used, install not in first-run state), so the response teaches a caller nothing. It never
        carries a detail.
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/setup-refused
            title: Setup was refused
            status: 401
    Forbidden:
      description: You are not allowed to do this
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/forbidden
            title: You are not allowed to do this
            status: 403
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    DirectoryAccessDenied:
      description: The directory refused our service account
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/directory-access-denied
            title: The directory refused our service account
            status: 403
    CsrfFailed:
      description: The CSRF check failed
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/csrf-failed
            title: The CSRF check failed
            status: 403
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/not-found
            title: Not found
            status: 404
    MethodNotAllowed:
      description: Method not allowed
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/method-not-allowed
            title: Method not allowed
            status: 405
    Conflict:
      description: The object already exists or the request conflicts
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/conflict
            title: The object already exists or the request conflicts
            status: 409
    PreconditionFailed:
      description: The precondition failed
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/precondition-failed
            title: The precondition failed
            status: 412
    PayloadTooLarge:
      description: The request body is too large
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/payload-too-large
            title: The request body is too large
            status: 413
    UnsupportedMediaType:
      description: Unsupported media type
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/unsupported-media-type
            title: Unsupported media type
            status: 415
    PasswordPolicyViolation:
      description: The password does not meet the policy
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/password-policy-violation
            title: The password does not meet the policy
            status: 422
    DirectoryConstraint:
      description: The directory rejected the change
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/directory-constraint
            title: The directory rejected the change
            status: 422
    IdempotencyKeyReuse:
      description: The idempotency key was used with a different request
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/idempotency-key-reuse
            title: The idempotency key was used with a different request
            status: 422
    PreconditionRequired:
      description: A precondition header is required
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/precondition-required
            title: A precondition header is required
            status: 428
    RateLimited:
      description: Too many requests
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/rate-limited
            title: Too many requests
            status: 429
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Internal:
      description: Internal error
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/internal
            title: Internal error
            status: 500
    DirectoryUnavailable:
      description: The directory is unavailable
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/directory-unavailable
            title: The directory is unavailable
            status: 503
    SearchQueryInvalid:
      description: >-
        The search text or cursor cannot be used. errors[].code says why: query_too_short (empty after normalisation), query_too_long (over 256
        characters), query_invalid (NUL or invalid UTF-8), query_refused (the text looks like a 48-digit BitLocker recovery password: refused
        without echoing, logging or tracing it; the same answer whatever the digits), cursor_invalid (bad, forged or mismatched cursor),
        cursor_requires_type. Neither detail nor errors ever repeat the text.
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/search-query-invalid
            title: The search text cannot be used
            status: 400
            detail: The search text is empty.
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            errors:
              - in: body
                pointer: /q
                code: query_too_short
                detail: Enter at least one character.
    SearchUnavailable:
      description: Search could not finish in time
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/search-unavailable
            title: Search is unavailable
            status: 503
            detail: Search could not finish. Try again, or narrow the text.
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    NotImplemented:
      description: The operation is declared but not built yet
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/not-implemented
            title: Not implemented
            status: 501
    NotReady:
      description: The service is running but not ready to take traffic
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/not-ready
            title: The service is not ready
            status: 503
    ReportResultExpired:
      description: The stored result or file has expired
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/report-result-expired
            title: The stored result has expired
            status: 410
    ReportScopeEmpty:
      description: The scope covers no directory objects
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/report-scope-empty
            title: The scope covers no directory objects
            status: 422
    OperationNotUndoable:
      description: The operation cannot be undone; errors[].code says why (irreversible, already_undone, superseded, not_finished, tier0_blocked, plan_refused)
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/operation-not-undoable
            title: The operation cannot be undone
            status: 409
    ReportScopeUnsupported:
      description: The scope uses a kind that reports cannot evaluate
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/report-scope-unsupported
            title: The scope uses a kind that reports cannot evaluate
            status: 409
    ReportRowCapExceeded:
      description: The result is over the row cap of the format
      content:
        application/problem+json:
          schema:
            $ref: shared/problems.yaml#/components/schemas/Problem
          example:
            type: /problems/report-row-cap-exceeded
            title: The result is over the row cap of the format
            status: 422
