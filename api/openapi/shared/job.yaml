components:
  schemas:
    JobStatus:
      description: Where a long-running operation is. Clients accept values they do not know.
      type: string
      x-activediq-enum: open
      enum: [queued, running, succeeded, failed, cancelled]
    JobItemOutcome:
      type: string
      x-activediq-enum: open
      enum: [succeeded, failed, skipped]
    JobActor:
      description: Who started a job.
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          maxLength: 32
        id:
          type: string
          maxLength: 128
    JobProgress:
      type: object
      required: [total, succeeded, failed]
      properties:
        total:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        succeeded:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        failed:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    JobLinks:
      type: object
      required: [items]
      properties:
        items:
          type: string
          maxLength: 512
        cancel:
          type: string
          maxLength: 512
    Job:
      description: >-
        A long operation (bulk change). It reports progress and per-item results, and is resumable
        after a restart.
      type: object
      required: [id, kind, status, dryRun, createdBy, progress, createdAt, startedAt, finishedAt, links]
      properties:
        id:
          type: string
          maxLength: 64
        kind:
          type: string
          maxLength: 128
        status:
          $ref: shared/job.yaml#/components/schemas/JobStatus
        dryRun:
          type: boolean
        createdBy:
          $ref: shared/job.yaml#/components/schemas/JobActor
        progress:
          $ref: shared/job.yaml#/components/schemas/JobProgress
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        links:
          $ref: shared/job.yaml#/components/schemas/JobLinks
